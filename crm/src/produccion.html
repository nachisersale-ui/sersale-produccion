<script>
  (function(){
    var role = sessionStorage.getItem("sersale_role");
    if (role === "director") return;
    if (role === "operario") { window.location.href = "pedidos.html"; return; }
    // Compat: si tiene auth legacy pero no rol nuevo, también dejarlo pasar (será migrado al loguear)
    if (sessionStorage.getItem("sersale_auth") === "ok") return;
    window.location.href = "index.html";
  })();
</script>

<style>
/* ── Capa visual compartida — Sersale ─────────────────────── */
:root{
  --carbon:#12161A; --lacre:#A4232A; --lacre-cl:#C33039;
  --hueso:#EFEAE1;  --tinta:#191E23; --acero:#79828B; --linea:#D8DCE0;
}
body{ font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;
      -webkit-font-smoothing:antialiased; color:var(--tinta) }
button,input,select,textarea{ font-family:inherit }

/* Cartelería: la familia condensada solo en las chapas de cabecera */
.chapa,.hdr-t,.header-sub,.card-title,.hdr-left h1{
  font-family:'Barlow Condensed','IBM Plex Sans',sans-serif;
  letter-spacing:.035em; font-size:1.06em;
}
.hdr-t,.hdr-left h1,.card-title{ text-transform:uppercase }

/* Datos duros en monoespaciada tabular */
.hdr-s,.mono,.dato{ font-family:'IBM Plex Mono',ui-monospace,monospace;
      font-variant-numeric:tabular-nums; letter-spacing:.04em }

/* Foco visible para teclado */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--lacre-cl); outline-offset:2px }
::selection{ background:var(--lacre); color:var(--hueso) }

/* Barras de desplazamiento discretas */
*::-webkit-scrollbar{ width:9px; height:9px }
*::-webkit-scrollbar-thumb{ background:#C4CAD1; border-radius:6px }
*::-webkit-scrollbar-track{ background:transparent }

@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
</style>
