<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#12161A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sersale CRM" />
  <title>CRM — Frigorífico Sersale</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Sistema visual Sersale ────────────────────────────
       carbón (cámara de frío) · lacre (sello) · hueso (rótulo) */
    :root{
      --carbon:#12161A; --pizarra:#1B2228;
      --lacre:#A4232A;  --lacre-cl:#C33039;
      --hueso:#EFEAE1;  --fondo:#EDEEF0;
      --tinta:#191E23;  --acero:#79828B;
      --linea:#D8DCE0;
      --app-max-w:480px;
    }
    @media (min-width:768px){ :root{ --app-max-w:880px } }
    @media (min-width:1200px){ :root{ --app-max-w:1020px } }

    *{ box-sizing:border-box; margin:0; padding:0 }
    body{ font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; background:var(--fondo); color:var(--tinta);
          min-height:100vh; padding-bottom:76px; -webkit-font-smoothing:antialiased }
    .display{ font-family:'Barlow Condensed',Haettenschweiler,sans-serif; text-transform:uppercase; font-weight:700; line-height:1; letter-spacing:.035em }
    .eyebrow{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; font-weight:500; letter-spacing:.17em; text-transform:uppercase; color:var(--acero) }
    .dato{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums }
    svg{ display:block }

    /* ── Portada de acceso ── */
    .gate{ min-height:100vh; background:var(--carbon); display:flex; flex-direction:column; align-items:center;
           justify-content:center; padding:34px 22px; position:relative; overflow:hidden }
    .gate::before{ content:""; position:absolute; top:-24%; left:50%; transform:translateX(-50%);
           width:min(720px,150vw); height:min(720px,150vw); pointer-events:none;
           background:radial-gradient(circle, rgba(164,35,42,.40) 0%, rgba(164,35,42,0) 62%) }
    .gate-in{ position:relative; width:100%; max-width:430px }
    .seal{ width:104px; height:104px; object-fit:contain; display:block; margin:0 auto 18px;
           filter:drop-shadow(0 12px 28px rgba(0,0,0,.6)) }
    .rule{ height:1px; max-width:250px; margin:15px auto 11px;
           background:linear-gradient(90deg,transparent,var(--lacre-cl) 45%,var(--lacre-cl) 55%,transparent) }

    /* Tarjeta de acceso: papel de rótulo con borde troquelado */
    .acceso{ position:relative; width:100%; font:inherit; text-align:left; cursor:pointer; border:none;
             background:var(--hueso); color:var(--tinta); border-radius:3px 3px 11px 11px;
             padding:22px 15px 17px; box-shadow:0 14px 30px rgba(0,0,0,.45);
             transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s }
    .acceso::before{ content:""; position:absolute; top:0; left:0; right:0; height:8px;
             background-image:radial-gradient(circle, var(--carbon) 1.7px, transparent 1.9px);
             background-size:9px 8px; background-position:1px -3px }
    .acceso:hover{ transform:translateY(-3px); box-shadow:0 20px 38px rgba(0,0,0,.55) }
    .acceso:active{ transform:translateY(-1px) scale(.99) }
    .acceso:focus-visible{ outline:2px solid var(--lacre-cl); outline-offset:3px }
    .acceso .req{ font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; letter-spacing:.15em;
             text-transform:uppercase; display:flex; align-items:center; gap:5px; margin-bottom:9px }
    .acceso .pip{ width:5px; height:5px; border-radius:50%; flex-shrink:0 }

    /* ── Panel director ── */
    .topbar{ background:var(--carbon); color:var(--hueso); padding:15px 18px 17px; position:relative }
    .topbar::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--lacre) }
    .mod{ display:block; position:relative; overflow:hidden; text-decoration:none; color:var(--tinta);
          background:#fff; border:1px solid var(--linea); border-radius:12px; padding:16px 14px 15px;
          transition:transform .16s, box-shadow .16s, border-color .16s }
    .mod::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
          background:var(--rule,var(--lacre));
          transform:scaleY(0); transform-origin:top; transition:transform .18s cubic-bezier(.2,.8,.3,1) }
    .mod:hover{ transform:translateY(-2px); border-color:#C4CAD1; box-shadow:0 10px 24px rgba(18,22,26,.10) }
    .mod:hover::before{ transform:scaleY(1) }
    .mod:active{ transform:translateY(0) scale(.99) }
    .qa{ display:flex; align-items:center; gap:11px; padding:11px 12px; margin-bottom:7px; font-size:13.5px;
         font-weight:500; text-decoration:none; color:var(--tinta); background:#fff;
         border:1px solid var(--linea); border-radius:10px; transition:background .14s, border-color .14s }
    .qa:hover{ background:#F6F7F9; border-color:#C4CAD1 }
    .panel{ background:#fff; border:1px solid var(--linea); border-radius:14px; padding:15px 14px }
    .salir{ position:absolute; top:14px; right:14px; display:flex; align-items:center; gap:6px;
            background:rgba(239,234,225,.09); color:var(--hueso); border:1px solid rgba(239,234,225,.18);
            border-radius:8px; padding:6px 10px; font-size:11px; font-weight:600; cursor:pointer;
            font-family:inherit; transition:background .15s }
    .salir:hover{ background:rgba(196,48,57,.85); border-color:transparent }

    /* ── Modales y formularios ── */
    .modal-bg{ position:fixed; inset:0; background:rgba(12,15,18,.72); backdrop-filter:blur(3px);
               display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px }
    .modal-box{ background:#fff; border-radius:14px; padding:26px 24px; width:100%; max-width:380px;
                box-shadow:0 26px 70px rgba(0,0,0,.45); border-top:3px solid var(--lacre) }
    .input-field{ width:100%; padding:12px 13px; border:1px solid var(--linea); border-radius:9px; font-size:15px;
                  font-family:inherit; color:var(--tinta); background:#FBFBFC; margin-bottom:10px; transition:border-color .15s, background .15s }
    .input-field:focus{ outline:none; border-color:var(--lacre); background:#fff }
    .btn-primary{ width:100%; padding:13px; border:none; border-radius:9px; background:var(--lacre); color:var(--hueso);
                  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.08em;
                  font-weight:600; font-size:17px; cursor:pointer; transition:background .15s }
    .btn-primary:hover{ background:var(--lacre-cl) }
    .btn-primary:disabled{ background:#B9BFC5; cursor:not-allowed }
    .btn-secondary{ width:100%; padding:11px; border:1px solid var(--linea); border-radius:9px; background:#fff;
                    color:var(--acero); font-size:13.5px; font-family:inherit; cursor:pointer; margin-top:8px }
    .btn-secondary:hover{ background:#F6F7F9 }
    .err-msg{ color:var(--lacre-cl); font-size:12.5px; font-weight:600; margin-bottom:9px; min-height:18px }
    .ok-msg{ color:#2F6B4F; font-size:12.5px; font-weight:600; margin-bottom:9px; min-height:18px }

    /* ── Movimiento ── */
    @keyframes subir{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
    @keyframes sello{ from{ opacity:0; transform:scale(.86) } to{ opacity:1; transform:none } }
    @keyframes trazo{ from{ transform:scaleX(0); opacity:0 } to{ transform:scaleX(1); opacity:1 } }
    @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .fade-in{ animation:subir .4s ease-out both }
    .an-sello{ animation:sello .55s cubic-bezier(.2,.8,.3,1) both }
    .an-1{ animation:subir .5s ease-out .12s both }
    .an-rule{ animation:trazo .5s ease-out .30s both }
    .an-2{ animation:subir .5s ease-out .36s both }
    .an-3{ animation:subir .5s ease-out .48s both }
    .shake{ animation:shake .4s }
    @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, setDoc, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDyijnox-MMjZTefC3LpT-KApfcU6uev8g",
      authDomain: "sersale-produccion.firebaseapp.com",
      projectId: "sersale-produccion",
      storageBucket: "sersale-produccion.firebasestorage.app",
      messagingSenderId: "925974326060",
      appId: "1:925974326060:web:12143f2ebb812d19dfda89"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.__db = db;
    window.__fb = { collection, addDoc, getDocs, getDoc, setDoc, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp, onSnapshot };
    window.__fbReady = true;
    document.dispatchEvent(new Event("fbReady"));
  </script>
</head>
<body>
  <div id="app"></div>

  <script>
    // ===== ESTADO DE SESIÓN =====
    var sesionRole = sessionStorage.getItem("sersale_role"); // "director" | "operario" | null
    var sesionUsuario = sessionStorage.getItem("sersale_usuario") || "";
    var sesionNombre = sessionStorage.getItem("sersale_nombre") || "";

    // ===== HASH SHA-256 =====
    async function hashPassword(pwd) {
      var enc = new TextEncoder().encode(pwd);
      var buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }

    // ===== FIREBASE HELPERS =====
    function fb() { return window.__fb ? Object.assign({db: window.__db}, window.__fb) : null; }
    function waitForFirebase(callback) {
      if (window.__fbReady) callback();
      else document.addEventListener("fbReady", callback);
    }


    // ===== ÍCONOS (SVG de trazo, heredan color) =====
    function ico(nombre, tam) {
      var t = tam || 22;
      var d = {
        pedidos:  '<path d="M3 7.6 12 3l9 4.6v8.8L12 21l-9-4.6z"/><path d="m3 7.6 9 4.6 9-4.6M12 12.2V21"/>',
        panel:    '<path d="M4 20h16"/><path d="M6.5 20v-6M11 20V8m4.5 12v-9M20 20V5"/>',
        planta:   '<path d="M3 21h18"/><path d="M4.5 21V11l5 3V11l5 3V7.5l5 3V21"/><path d="M8 17.5h.01M13 17.5h.01M18 17.5h.01"/>',
        ventas:   '<rect x="2.8" y="6.2" width="18.4" height="11.6" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 12h.01M18 12h.01"/>',
        presup:   '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12.5h5M10 16h3.5"/>',
        usuarios: '<circle cx="9.2" cy="8.4" r="3.1"/><path d="M3.6 20c0-3.1 2.5-4.9 5.6-4.9s5.6 1.8 5.6 4.9"/><path d="M16.4 6.1a3.1 3.1 0 0 1 0 5.6M17.6 20c0-2.3-.7-3.8-1.9-4.6"/>',
        carrito:  '<path d="M2.8 4h2.4l2.3 10.4h9.6l2.1-7.6H6.3"/><circle cx="9.6" cy="19" r="1.4"/><circle cx="16.6" cy="19" r="1.4"/>',
        rayo:     '<path d="M13.2 2.6 5.4 13.4h5.2l-1.2 8 8-11h-5.4z"/>',
        backup:   '<path d="M12 3.4v10.4"/><path d="m8.2 10.6 3.8 3.8 3.8-3.8"/><path d="M4.2 19.6h15.6"/>',
        salir:    '<path d="M12 3.2v8.6"/><path d="M7.1 6.4a7.6 7.6 0 1 0 9.8 0"/>',
        candado:  '<rect x="4.6" y="10.4" width="14.8" height="10" rx="2.2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/>',
        puerta:   '<path d="M14.6 3.2H5.4v17.6h9.2"/><path d="M10.4 12h9.4"/><path d="m16.6 8.8 3.2 3.2-3.2 3.2"/>'
      };
      return '<svg width="'+t+'" height="'+t+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
             'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (d[nombre]||'') + '</svg>';
    }

    // ===== RENDER PRINCIPAL =====
    function render() {
      if (sesionRole === "director") {
        document.getElementById("app").innerHTML = renderDashboardDirector();
      } else {
        // Operario o sin sesión: pantalla de selección de rol
        document.getElementById("app").innerHTML = renderSeleccionRol();
      }
      aplicarNav();
    }

    // La barra inferior solo existe una vez iniciada la sesión como Director.
    // Se llama también en DOMContentLoaded porque el nodo se declara después de este script.
    function aplicarNav() {
      var nav = document.getElementById("sersale_nav") || document.getElementById("__crm_nav");
      var visible = (sesionRole === "director");
      if (nav) nav.style.display = visible ? "flex" : "none";
      document.body.style.paddingBottom = visible ? "76px" : "0";
    }
    document.addEventListener("DOMContentLoaded", aplicarNav);

    // ===== PANTALLA: SELECCIÓN DE ROL =====
    function renderSeleccionRol() {
      function acceso(cfg) {
        return '<button class="acceso ' + cfg.anim + '" onclick="' + cfg.accion + '">' +
          '<div class="req" style="color:' + cfg.pipColor + '">' +
            '<span class="pip" style="background:' + cfg.pipColor + '"></span>' + cfg.req +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">' +
            '<span style="color:' + cfg.pipColor + '">' + ico(cfg.icono, 19) + '</span>' +
            '<span class="display" style="font-size:25px">' + cfg.titulo + '</span>' +
          '</div>' +
          '<div style="font-size:12px;line-height:1.45;color:#5C666F">' + cfg.desc + '</div>' +
        '</button>';
      }
      return '<div class="gate"><div class="gate-in">' +
        '<img src="' + LOGO + '" class="seal an-sello" alt="Sello Frigorífico Sersale" />' +
        '<h1 class="display an-1" style="color:var(--hueso);font-size:31px;text-align:center;letter-spacing:.05em">Frigor\u00edfico Sersale</h1>' +
        '<div class="rule an-rule"></div>' +
        '<p class="eyebrow an-1" style="text-align:center;color:rgba(239,234,225,.5)">Sistema de gesti\u00f3n interno</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px">' +
          acceso({ anim:"an-2", accion:"abrirLoginDirector()", icono:"candado", pipColor:"#A4232A",
                   req:"Con clave", titulo:"Director", desc:"Pedidos, producci\u00f3n, ventas y cuentas corrientes" }) +
          acceso({ anim:"an-3", accion:"entrarOperario()", icono:"puerta", pipColor:"#2F6B4F",
                   req:"Sin clave", titulo:"Operario", desc:"Dep\u00f3sito: preparaci\u00f3n y despacho de pedidos" }) +
        '</div>' +
        '<p class="dato an-3" style="text-align:center;margin-top:30px;font-size:10px;letter-spacing:.1em;color:rgba(239,234,225,.34)">' +
          'CUIT 30-70227633-7 &nbsp;\u00b7&nbsp; SENASA EST. 3839' +
        '</p>' +
      '</div></div>';
    }

    // ===== ACCIÓN: ENTRAR COMO OPERARIO =====
    window.entrarOperario = function() {
      sessionStorage.setItem("sersale_role", "operario");
      sessionStorage.removeItem("sersale_usuario");
      sessionStorage.removeItem("sersale_nombre");
      // Compatibilidad: muchos módulos aún chequean sersale_auth
      sessionStorage.setItem("sersale_auth", "ok");
      window.location.href = "pedidos.html";
    };

    // ===== ACCIÓN: ABRIR MODAL DE LOGIN DIRECTOR =====
    window.abrirLoginDirector = function() {
      var modal = document.createElement("div");
      modal.className = "modal-bg";
      modal.id = "__login_modal";
      modal.innerHTML =
        '<div class="modal-box fade-in" onclick="event.stopPropagation()">' +
          '<div style="margin-bottom:18px">' +
            '<p class="eyebrow" style="margin-bottom:5px">Acceso con clave</p>' +
            '<h2 class="display" style="font-size:27px;color:var(--tinta)">Director</h2>' +
            '<p style="font-size:12.5px;color:var(--acero);margin-top:4px">Usuario y contrase\u00f1a del sistema</p>' +
          '</div>' +
          '<form id="__login_form" autocomplete="off">' +
            '<input type="text" id="__login_user" class="input-field" placeholder="Usuario" autocomplete="off" autocapitalize="none" autofocus />' +
            '<input type="password" id="__login_pwd" class="input-field" placeholder="Contraseña" autocomplete="off" />' +
            '<div id="__login_msg" class="err-msg"></div>' +
            '<button type="submit" class="btn-primary" id="__login_btn">Entrar</button>' +
            '<button type="button" class="btn-secondary" onclick="cerrarLoginModal()">Cancelar</button>' +
          '</form>' +
        '</div>';
      modal.onclick = cerrarLoginModal;
      document.body.appendChild(modal);
      document.getElementById("__login_form").onsubmit = function(e) {
        e.preventDefault();
        intentarLogin();
      };
      setTimeout(function(){ document.getElementById("__login_user").focus(); }, 100);
    };

    window.cerrarLoginModal = function() {
      var m = document.getElementById("__login_modal");
      if (m) m.remove();
    };

    // ===== ACCIÓN: INTENTAR LOGIN =====
    async function intentarLogin() {
      var usuario = document.getElementById("__login_user").value.trim().toLowerCase();
      var pwd = document.getElementById("__login_pwd").value;
      var msg = document.getElementById("__login_msg");
      var btn = document.getElementById("__login_btn");
      msg.textContent = "";
      msg.className = "err-msg";
      if (!usuario || !pwd) {
        msg.textContent = "Completá usuario y contraseña";
        return;
      }
      if (!window.__fbReady) {
        msg.textContent = "Conectando con la base de datos...";
        await new Promise(function(r){ document.addEventListener("fbReady", r, {once:true}); });
      }
      btn.disabled = true;
      btn.textContent = "Verificando...";
      try {
        var f = fb();
        var col = f.collection(f.db, "usuarios");
        var snap = await f.getDocs(col);
        var pwdHash = await hashPassword(pwd);

        // ¿Bootstrap? Si la colección está vacía, creo el primer Director con estas credenciales
        if (snap.empty) {
          msg.className = "ok-msg";
          msg.textContent = "Creando primer usuario Director...";
          var nuevo = {
            usuario: usuario,
            passwordHash: pwdHash,
            nombre: usuario.charAt(0).toUpperCase() + usuario.slice(1),
            activo: true,
            creado: f.Timestamp.now()
          };
          await f.setDoc(f.doc(f.db, "usuarios", usuario), nuevo);
          // Loguearlo
          loginExitoso(usuario, nuevo.nombre);
          return;
        }

        // Buscar usuario
        var encontrado = null;
        snap.forEach(function(d){
          if (d.id === usuario || (d.data().usuario || "").toLowerCase() === usuario) {
            encontrado = Object.assign({id: d.id}, d.data());
          }
        });
        if (!encontrado) {
          msg.textContent = "Usuario o contraseña incorrectos";
          shake(); btn.disabled = false; btn.textContent = "Ingresar";
          return;
        }
        if (encontrado.activo === false) {
          msg.textContent = "Usuario desactivado";
          shake(); btn.disabled = false; btn.textContent = "Ingresar";
          return;
        }
        if (encontrado.passwordHash !== pwdHash) {
          msg.textContent = "Usuario o contraseña incorrectos";
          shake(); btn.disabled = false; btn.textContent = "Ingresar";
          return;
        }
        loginExitoso(encontrado.usuario || encontrado.id, encontrado.nombre || encontrado.id);
      } catch(err) {
        console.error(err);
        msg.textContent = "Error al conectar. Reintentá.";
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    }

    function shake() {
      var box = document.querySelector("#__login_modal .modal-box");
      if (box) { box.classList.add("shake"); setTimeout(function(){ box.classList.remove("shake"); }, 400); }
    }

    function loginExitoso(usuario, nombre) {
      sessionStorage.setItem("sersale_role", "director");
      sessionStorage.setItem("sersale_usuario", usuario);
      sessionStorage.setItem("sersale_nombre", nombre);
      sessionStorage.setItem("sersale_auth", "ok"); // compat con guards existentes
      sesionRole = "director";
      sesionUsuario = usuario;
      sesionNombre = nombre;
      cerrarLoginModal();
      render();
    }

    // ===== CERRAR SESIÓN =====
    window.cerrarSesion = function() {
      sessionStorage.removeItem("sersale_role");
      sessionStorage.removeItem("sersale_usuario");
      sessionStorage.removeItem("sersale_nombre");
      sessionStorage.removeItem("sersale_auth");
      sesionRole = null; sesionUsuario = ""; sesionNombre = "";
      render();
    };

    // ===== DASHBOARD DIRECTOR =====
    function renderDashboardDirector() {
      var modulos = [
        {ico:"pedidos",  nombre:"Pedidos",      desc:"Carga, remitos y cuentas corrientes", url:"pedidos.html",       color:"#A4232A"},
        {ico:"panel",    nombre:"Dashboard",    desc:"KPIs y facturaci\u00f3n",                url:"dashboard.html",     color:"#26536E"},
        {ico:"planta",   nombre:"Producci\u00f3n",  desc:"Faena, stock y salidas",              url:"produccion.html",    color:"#2F6B4F"},
        {ico:"ventas",   nombre:"Ventas",       desc:"Cierre de caja diario",               url:"ventas.html",        color:"#6B4E8E"},

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; });

    // ===== GESTIÓN DE USUARIOS (Director only) =====
    window.abrirGestionUsuarios = async function() {
      if (sesionRole !== "director") return;
      var modal = document.createElement("div");
      modal.className = "modal-bg";
      modal.id = "__usr_modal";
      modal.style.alignItems = "flex-start";
      modal.style.overflowY = "auto";
      modal.style.padding = "20px 12px";
      modal.innerHTML =
        '<div class="modal-box fade-in" style="max-width:520px;padding:22px" onclick="event.stopPropagation()">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
            '<h2 style="font-size:18px;font-weight:800;color:#191E23">👥 Gestión de Usuarios</h2>' +
            '<button onclick="cerrarUsrModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#79828B;line-height:1">×</button>' +
          '</div>' +
          '<button onclick="abrirFormUsuario()" class="btn-primary" style="margin-bottom:14px">➕ Nuevo Director</button>' +
          '<div id="__usr_lista" style="min-height:80px"><p style="text-align:center;color:#79828B;font-size:13px">Cargando...</p></div>' +
          '<button class="btn-secondary" onclick="cerrarUsrModal()">Cerrar</button>' +
        '</div>';
      modal.onclick = function(){ cerrarUsrModal(); };
      document.body.appendChild(modal);
      await cargarListaUsuarios();
    };

    window.cerrarUsrModal = function() {
      var m = document.getElementById("__usr_modal");
      if (m) m.remove();
    };

    async function cargarListaUsuarios() {
      var cont = document.getElementById("__usr_lista");
      if (!cont) return;
      try {
        var f = fb();
        var snap = await f.getDocs(f.collection(f.db, "usuarios"));
        if (snap.empty) {
          cont.innerHTML = '<p style="text-align:center;color:#79828B;font-size:13px;padding:20px">No hay usuarios cargados</p>';
          return;
        }
        var html = '<div style="border:1px solid #E8E8E8;border-radius:10px;overflow:hidden">';
        var arr = [];
        snap.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); });
        arr.sort(function(a,b){ return (a.usuario||a.id).localeCompare(b.usuario||b.id); });
        arr.forEach(function(u, i){
          var nombre = escapeHtml(u.nombre || u.id);
          var usr = escapeHtml(u.usuario || u.id);
          var activo = u.activo !== false;
          var esActual = (u.usuario || u.id) === sesionUsuario;
          html += '<div style="display:flex;align-items:center;gap:10px;padding:12px;'+(i>0?"border-top:1px solid #E4E7EA":"")+';background:'+(activo?"#fff":"#F7F8F9")+'">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:700;font-size:14px;color:#191E23">' + nombre + (esActual?' <span style="font-size:10px;color:#2F6B4F;font-weight:600">(vos)</span>':'') + '</div>' +
              '<div style="font-size:11px;color:#79828B">@'+usr+' · '+(activo?"Activo":"Desactivado")+'</div>' +
            '</div>' +
            '<button onclick="cambiarPwdUsuario(\'' + usr + '\')" title="Cambiar contraseña" style="background:#E7EDF1;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px">🔑</button>' +
            (esActual ? '' : '<button onclick="toggleActivoUsuario(\'' + usr + '\',' + (!activo) + ')" title="' + (activo?"Desactivar":"Activar") + '" style="background:' + (activo?"#F3EEE2":"#E9F0EC") + ';border:none;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px">' + (activo?"🚫":"✅") + '</button>') +
            (esActual ? '' : '<button onclick="eliminarUsuario(\'' + usr + '\')" title="Eliminar" style="background:#F7EAEA;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px">🗑️</button>') +
          '</div>';
        });
        html += '</div>';
        cont.innerHTML = html;
      } catch(err) {
        console.error(err);
        cont.innerHTML = '<p style="text-align:center;color:#C33039;font-size:13px;padding:20px">Error al cargar usuarios</p>';
      }
    }

    window.abrirFormUsuario = function() {
      var box = document.querySelector("#__usr_modal .modal-box");
      if (!box) return;
      var html =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
          '<h2 style="font-size:18px;font-weight:800;color:#191E23">➕ Nuevo Director</h2>' +
          '<button onclick="abrirGestionUsuarios()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#79828B;line-height:1">×</button>' +
        '</div>' +
        '<form id="__nuevo_usr_form" autocomplete="off">' +
          '<input type="text" id="__nu_nombre" class="input-field" placeholder="Nombre completo (ej: Fernando García)" />' +
          '<input type="text" id="__nu_usuario" class="input-field" placeholder="Usuario (sin espacios, ej: fernando)" autocapitalize="none" />' +
          '<input type="password" id="__nu_pwd" class="input-field" placeholder="Contraseña" />' +
          '<input type="password" id="__nu_pwd2" class="input-field" placeholder="Repetir contraseña" />' +
          '<div id="__nu_msg" class="err-msg"></div>' +
          '<button type="submit" class="btn-primary">Crear usuario</button>' +
          '<button type="button" class="btn-secondary" onclick="abrirGestionUsuarios()">Volver</button>' +
        '</form>';
      box.innerHTML = html;
      document.getElementById("__nuevo_usr_form").onsubmit = async function(e) {
        e.preventDefault();
        var nombre = document.getElementById("__nu_nombre").value.trim();
        var usr = document.getElementById("__nu_usuario").value.trim().toLowerCase();
        var p1 = document.getElementById("__nu_pwd").value;
        var p2 = document.getElementById("__nu_pwd2").value;
        var msg = document.getElementById("__nu_msg");
        msg.textContent = "";
        if (!nombre || !usr || !p1) { msg.textContent = "Completá todos los campos"; return; }
        if (!/^[a-z0-9_.-]+$/.test(usr)) { msg.textContent = "Usuario solo con letras minúsculas, números, _ . -"; return; }
        if (p1.length < 4) { msg.textContent = "La contraseña debe tener al menos 4 caracteres"; return; }
        if (p1 !== p2) { msg.textContent = "Las contraseñas no coinciden"; return; }
        try {
          var f = fb();
          var ref = f.doc(f.db, "usuarios", usr);
          var existe = await f.getDoc(ref);
          if (existe.exists()) { msg.textContent = "Ya existe un usuario con ese nombre"; return; }
          var pwdHash = await hashPassword(p1);
          await f.setDoc(ref, {
            usuario: usr, passwordHash: pwdHash, nombre: nombre, activo: true, creado: f.Timestamp.now()
          });
          await window.abrirGestionUsuarios();
        } catch(err) { console.error(err); msg.textContent = "Error al crear usuario"; }
      };
    };

    window.cambiarPwdUsuario = async function(usr) {
      var nueva = prompt("Nueva contraseña para @"+usr+":");
      if (!nueva) return;
      if (nueva.length < 4) { alert("La contraseña debe tener al menos 4 caracteres"); return; }
      try {
        var f = fb();
        var pwdHash = await hashPassword(nueva);
        await f.updateDoc(f.doc(f.db, "usuarios", usr), { passwordHash: pwdHash });
        alert("Contraseña actualizada");
      } catch(err) { console.error(err); alert("Error al actualizar"); }
    };

    window.toggleActivoUsuario = async function(usr, nuevoEstado) {
      try {
        var f = fb();
        await f.updateDoc(f.doc(f.db, "usuarios", usr), { activo: nuevoEstado });
        await cargarListaUsuarios();
      } catch(err) { console.error(err); alert("Error al actualizar"); }
    };

    window.eliminarUsuario = async function(usr) {
      if (!confirm("¿Eliminar al usuario @"+usr+"? Esta acción no se puede deshacer.")) return;
      try {
        var f = fb();
        await f.deleteDoc(f.doc(f.db, "usuarios", usr));
        await cargarListaUsuarios();
      } catch(err) { console.error(err); alert("Error al eliminar"); }
    };
