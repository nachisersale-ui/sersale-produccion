<!DOCTYPE html>
<html lang="es">
<head>
<script src="js/sesion.js"></script>
<script>
  (function(){
    var role = sessionStorage.getItem("sersale_role");
    var auth = sessionStorage.getItem("sersale_auth");
    // Aceptar tanto rol nuevo (director/operario) como auth legacy
    if (role === "director" || role === "operario" || auth === "ok") return;
    window.location.href = "index.html";
  })();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

<meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Sersale — Pedidos</title>
  <script src="vendor/email.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="assets/logo-data.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script type="module">
    import { db, collection, addDoc, getDocs, getDoc, setDoc, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp, onSnapshot, increment, runTransaction, precalentar } from "./js/fb.js";
    // Traer de entrada las colecciones que usan casi todas las pantallas: así
    // al cambiar de vista los datos ya están en el teléfono.
    precalentar(sessionStorage.getItem("sersale_role") === "operario"
      ? ["pedidos"]
      : ["pedidos", "clientes", "cuentas_corrientes", "cc_movimientos", "precios_cliente"]);
    window.__db = db;
    window.__fb = { collection, addDoc, getDocs, getDoc, setDoc, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp, onSnapshot, increment, runTransaction };
    window.__fbReady = true;
    (async()=>{
      try {
        const snap = await getDoc(doc(db,"config","productos"));
        if(snap.exists() && snap.data().categorias) {
          window.__productosOverride = snap.data().categorias;
        }
      } catch(e){}
      document.dispatchEvent(new Event("fbReady"));
    })();
  </script>
  <style>

    body { background: #F2F3F5; font-family: 'IBM Plex Sans','IBM Plex Sans','Inter',sans-serif; }
    input, select, textarea, button { font-family: inherit; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .new-badge { display:inline-flex; align-items:center; justify-content:center; background:#C33039; color:#fff; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:700; margin-left:6px; }

    :root { --app-max-w: 480px; }

    }
    @media (min-width: 1200px) {

    }
    .crm-page {
      min-height: 100vh;
      background: var(--fondo);

      margin: 0 auto;
    }

<style>

  --carbon:#12161A; --lacre:#A4232A; --lacre-cl:#C33039;

button,input,select,textarea{ font-family:inherit }

/* Cartelería: la familia condensada solo en las chapas de cabecera */
.chapa,.hdr-t,.header-sub,.card-title,.hdr-left h1{
  font-family:'Barlow Condensed','IBM Plex Sans',sans-serif;
  letter-spacing:.035em; font-size:1.06em;
}
