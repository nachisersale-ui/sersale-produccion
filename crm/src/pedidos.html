  <script type="text/babel">
    const { useState, useEffect } = React;

    const CLIENTES_DEFAULT = [
      "Supermercado Don Juan","Carnicería El Gaucho","Rotisería La Porteña",
      "Distribuidora Río de la Plata","Restaurant El Fogón","Carnicería San Martín",

    // ── FORMATO DE MONTOS (separador de miles) ──────────────
    // Valor interno: string plano con "." decimal ("1000000.5")
    // Valor mostrado: formato es-AR ("1.000.000,5")
    function fmtMilesTxt(raw) {
      if (raw === null || raw === undefined) return "";
      let s = String(raw).trim();
      if (s === "") return "";
      const neg = s.charAt(0) === "-";
      s = s.replace(/-/g, "");
      const partes = s.split(".");
      let ent = (partes[0] || "").replace(/\D/g, "");
      const dec = partes.length > 1 ? partes[1].replace(/\D/g, "") : undefined;
      ent = ent.replace(/^0+(?=\d)/, "");
      const entF = ent === "" ? (dec !== undefined ? "0" : "") : ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return (neg ? "-" : "") + entF + (dec !== undefined ? "," + dec : "");
    }
    function desfmtMiles(txt) {
      if (txt === null || txt === undefined) return "";
      let s = String(txt).replace(/\s/g, "").replace(/\./g, "").replace(/,/g, ".");
      const neg = s.charAt(0) === "-";
      s = s.replace(/[^0-9.]/g, "");
      const p = s.split(".");
      if (p.length > 2) s = p[0] + "." + p.slice(1).join("");
      if (s.charAt(0) === ".") s = "0" + s;
      const q = s.split(".");
      if (q.length === 2) s = q[0] + "." + q[1].slice(0, 2);
      return (neg && s !== "" ? "-" : "") + s;
    }

    // Input de monto con separador de miles en vivo y cursor estable
    function InputMonto({ value, onChange, ...rest }) {
      const ref = React.useRef(null);
      const caretRef = React.useRef(null);
      React.useEffect(() => {
        const el = ref.current;
        if (!el || caretRef.current === null) return;
        const objetivo = caretRef.current;
        caretRef.current = null;
        const t = el.value;
        let cnt = 0, pos = t.length;
        if (objetivo === 0) { pos = 0; }
        else {
          for (let i = 0; i < t.length; i++) {
            if (/[0-9,]/.test(t[i])) cnt++;
            if (cnt === objetivo) { pos = i + 1; break; }
          }
        }
        try { el.setSelectionRange(pos, pos); } catch (e) {}
      });
      function handleChange(e) {
        const el = e.target;
        const cs = el.selectionStart || 0;
        caretRef.current = (el.value.slice(0, cs).match(/[0-9,]/g) || []).length;
        onChange(desfmtMiles(el.value));
      }
      // Backspace sobre un punto de miles borra el dígito anterior
      function handleKeyDown(e) {
        if (e.key !== "Backspace") return;
        const el = e.target;
        if (el.selectionStart !== el.selectionEnd) return;
        const s = el.selectionStart;
        if (s > 1 && el.value.charAt(s - 1) === ".") {
          e.preventDefault();
          const nuevo = el.value.slice(0, s - 2) + el.value.slice(s);
          caretRef.current = (el.value.slice(0, s - 2).match(/[0-9,]/g) || []).length;
          onChange(desfmtMiles(nuevo));
        }
      }
      return (
        <input ref={ref} type="text" inputMode="decimal" value={fmtMilesTxt(value)}
          onChange={handleChange} onKeyDown={handleKeyDown} {...rest} />
      );
    }

    // ── HISTORIAL PRECIOS POR CLIENTE ──────────────────────
    function HistorialPrecios({ cliente, onBack }) {
      const [precios, setPrecios] = useState(null);
      const [filtroProducto, setFiltroProducto] = useState("");
      const [editModal, setEditModal] = useState(null); // {id, producto, precio} or {nuevo:true}
      const [formProducto, setFormProducto] = useState("");
      const [formPrecio, setFormPrecio] = useState("");
      const [guardando, setGuardando] = useState(false);

      function cargar() {
        (async()=>{
          try {
            const { db, collection, getDocs, query, where } = fb();
            const snap = await getDocs(query(
              collection(db,"precios_cliente"),
              where("cliente","==",cliente)
            ));
            const docs = snap.docs.map(d=>({id:d.id,...d.data()}))
              .sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
            const grouped = {};
            docs.forEach(d=>{
              if(!grouped[d.producto]) grouped[d.producto]=[];
              grouped[d.producto].push(d);
            });
            setPrecios(grouped);
          } catch(e){ console.error(e); setPrecios({}); }
        })();
      }

      useEffect(()=>{
        if(window.__fbReady) cargar(); else document.addEventListener("fbReady",cargar);
      },[]);

      function abrirEditar(entry) {
        setEditModal(entry);
        setFormProducto(entry.producto);
        setFormPrecio(String(entry.precio));
      }
      function abrirNuevo() {
        setEditModal({nuevo:true});
        setFormProducto("");
        setFormPrecio("");
      }
      async function guardarPrecio() {
        if(!formProducto.trim()) return alert("Ingresá el producto");
        if(!formPrecio||isNaN(+formPrecio)||+formPrecio<=0) return alert("Ingresá un precio válido");
        setGuardando(true);
        try {
          const { db, collection, addDoc, doc, updateDoc } = fb();
          if(editModal.nuevo) {
            await addDoc(collection(db,"precios_cliente"),{
              cliente, producto:formProducto.trim(), precio:+formPrecio,
              fecha:new Date().toISOString()
            });
          } else {
            await updateDoc(doc(db,"precios_cliente",editModal.id),{
              producto:formProducto.trim(), precio:+formPrecio,
              fecha:new Date().toISOString()
            });
          }
          setEditModal(null);
          cargar();
        } catch(e){ alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }
      async function eliminarPrecio(id, producto) {
        if(!confirm("¿Eliminar precio de "+producto+"?")) return;
        try {
          const { db, doc, deleteDoc } = fb();
          await deleteDoc(doc(db,"precios_cliente",id));
          cargar();
        } catch(e){ alert("Error al eliminar"); console.error(e); }
      }

      const productos = precios ? Object.keys(precios).filter(p=>!filtroProducto||p.toLowerCase().includes(filtroProducto.toLowerCase())).sort() : [];

      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"16px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:16}}>Precios — {cliente}</div>
              <div style={{fontSize:11,opacity:.8}}>Historial por producto · Tocá para editar</div>
            </div>
            <button onClick={abrirNuevo} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Nuevo</button>
          </div>
          <div style={{padding:16}}>
            <input style={{width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:14}}
              placeholder="🔍 Buscar producto..." value={filtroProducto} onChange={e=>setFiltroProducto(e.target.value)} />
            {precios===null ? <p style={{textAlign:"center",color:"#79828B",marginTop:40}}>Cargando...</p>
            : productos.length===0 ? (
              <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}>
                <div style={{fontSize:48}}>📈</div>
                <p>Sin precios registrados para este cliente</p>
                <p style={{fontSize:12,marginTop:8}}>Tocá <b>+ Nuevo</b> para agregar un precio manualmente</p>
              </div>
            ) : productos.map(prod=>{
              const hist = precios[prod];
              const ultimo = hist[0];
              const anterior = hist[1];
              const diff = anterior ? ((ultimo.precio - anterior.precio)/anterior.precio*100) : null;
              return (
                <div key={prod} style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div style={{flex:1,paddingRight:8,cursor:"pointer"}} onClick={()=>abrirEditar(ultimo)}>
                      <div style={{fontWeight:700,fontSize:14,color:"#191E23",marginBottom:2}}>{prod}</div>
                      <div style={{fontSize:11,color:"#79828B"}}>{hist.length} precio{hist.length!==1?"s":""} registrado{hist.length!==1?"s":""} · Tocá para editar</div>
                    </div>
                    <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                      <div style={{textAlign:"right",cursor:"pointer"}} onClick={()=>abrirEditar(ultimo)}>
                        <div style={{fontWeight:900,fontSize:18,color:"#26536E"}}>${ultimo.precio.toLocaleString("es-AR")}/kg</div>
                        {diff!==null && (
                          <div style={{fontSize:11,fontWeight:600,color:diff>0?"#C33039":diff<0?"#2F6B4F":"#79828B"}}>
                            {diff>0?"▲":"▼"} {Math.abs(diff).toFixed(1)}% vs anterior
                          </div>
                        )}
                      </div>
                      <button onClick={()=>eliminarPrecio(ultimo.id, prod)} style={{background:"none",border:"none",color:"#C33039",fontSize:16,cursor:"pointer",padding:"2px 4px",opacity:0.5}}>✕</button>
                    </div>
                  </div>
                  {hist.length>1 && (
                    <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:8,height:36}}>
                      {hist.slice(0,8).reverse().map((h,i,arr)=>{
                        const min=Math.min(...arr.map(x=>x.precio));
                        const max=Math.max(...arr.map(x=>x.precio));
                        const pct=max===min?80:20+((h.precio-min)/(max-min))*60;
                        const isLast=i===arr.length-1;
                        return <div key={i} style={{flex:1,background:isLast?"#26536E":"#DCE5EB",borderRadius:"3px 3px 0 0",height:`${pct}%`,minHeight:4,transition:"height .3s"}} title={`$${h.precio}`}></div>;
                      })}
                    </div>
                  )}
                  <div style={{borderTop:"1px solid #EDEEF0",paddingTop:8}}>
                    {hist.slice(0,4).map((h,i)=>(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",color:i===0?"#191E23":"#79828B",alignItems:"center"}}>
                        <span>{new Date(h.fecha).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})}</span>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontWeight:i===0?700:400}}>${h.precio.toLocaleString("es-AR")}/kg</span>
                          {i>0 && <button onClick={()=>eliminarPrecio(h.id, prod)} style={{background:"none",border:"none",color:"#B9BFC5",fontSize:12,cursor:"pointer",padding:0}}>✕</button>}
                        </div>
                      </div>
                    ))}
                    {hist.length>4 && <div style={{fontSize:11,color:"#A3ABB3",marginTop:4}}>+ {hist.length-4} registros anteriores</div>}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Modal editar/nuevo precio */}
          {editModal && (
            <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
              <div style={{background:"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:380,boxShadow:"0 8px 32px rgba(0,0,0,0.3)"}}>
                <h3 style={{fontSize:16,fontWeight:800,marginBottom:16,color:"#2A333B"}}>{editModal.nuevo?"Agregar precio":"Editar precio"}</h3>
                <div style={{marginBottom:14}}>
                  <label style={{display:"block",fontWeight:700,fontSize:12,color:"#3A424A",marginBottom:6}}>Producto</label>
                  {editModal.nuevo ? (
                    <select value={formProducto} onChange={e=>setFormProducto(e.target.value)}
                      style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:14,outline:"none",background:"#fff"}}>
                      <option value="">— Seleccionar producto —</option>
                      {Object.entries(getProductos()).map(([cat, prods])=>(
                        <optgroup key={cat} label={cat}>
                          {prods.filter(p=>p).map(p=>{
                            const yaExiste = precios && precios[p];
                            return <option key={p} value={p} style={{color:yaExiste?"#A3ABB3":"#191E23"}}>{p}{yaExiste?" (ya cargado)":""}</option>;
                          })}
                        </optgroup>
                      ))}
                    </select>
                  ) : (
                    <input value={formProducto} onChange={e=>setFormProducto(e.target.value)}
                      style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:14,outline:"none"}} />
                  )}
                </div>
                <div style={{marginBottom:20}}>
                  <label style={{display:"block",fontWeight:700,fontSize:12,color:"#3A424A",marginBottom:6}}>Precio por kg ($)</label>
                  <InputMonto value={formPrecio} onChange={v=>setFormPrecio(v)}
                    placeholder="0"
                    style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:18,fontWeight:700,outline:"none",textAlign:"right"}} />
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setEditModal(null)} style={{flex:1,padding:13,borderRadius:10,border:"1.5px solid #D8DCE0",background:"#fff",color:"#5C666F",fontWeight:700,fontSize:14,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={guardarPrecio} disabled={guardando}
                    style={{flex:1,padding:13,borderRadius:10,border:"none",background:guardando?"#A3ABB3":"#26536E",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                    {guardando?"Guardando...":"💾 Guardar"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );

    // ── GESTIÓN DE CLIENTES ─────────────────────────────────

    // ── GESTIÓN DE PRODUCTOS ─────────────────────────────────
    function GestionProductos({ onBack }) {
      const [cats, setCats] = useState(null); // {cat: [prod,...]}
      const [guardando, setGuardando] = useState(false);
      const [modalCat, setModalCat] = useState(null); // cat seleccionada para agregar prod
      const [modalNuevaCat, setModalNuevaCat] = useState(false);
      const [inputProd, setInputProd] = useState("");
      const [inputCat, setInputCat] = useState("");
      const [expandida, setExpandida] = useState(null);

      async function cargar() {
        try {
          const {db,doc,getDoc} = fb();
          const snap = await getDoc(doc(db,"config","productos"));
          if(snap.exists()) {
            setCats(snap.data().categorias);
          } else {
            // Primera vez: usar PRODUCTOS hardcodeado como base
            setCats(PRODUCTOS);
          }
        } catch(e){ console.error(e); setCats(PRODUCTOS); }
      }

      async function guardar(nuevasCats) {
        setGuardando(true);
        try {
          const {db,doc,setDoc} = fb();
          await setDoc(doc(db,"config","productos"), { categorias: nuevasCats, updatedAt: new Date().toISOString() });
          window.__productosOverride = nuevasCats;
          setCats(nuevasCats);
        } catch(e){ alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }

      async function agregarProducto() {
        const nombre = inputProd.trim();
        if(!nombre) return;
        const nuevasCats = {...cats};
        if(!nuevasCats[modalCat]) nuevasCats[modalCat] = [];
        if(nuevasCats[modalCat].includes(nombre)){ alert("Ya existe ese producto en esta categoría"); return; }
        nuevasCats[modalCat] = [...nuevasCats[modalCat], nombre];
        await guardar(nuevasCats);
        setInputProd(""); setModalCat(null);
      }

      async function eliminarProducto(cat, prod) {
        if(!confirm(`¿Eliminar "${prod}" de ${cat}?`)) return;
        const nuevasCats = {...cats, [cat]: cats[cat].filter(p=>p!==prod)};
        await guardar(nuevasCats);
      }

      async function agregarCategoria() {
        const nombre = inputCat.trim();
        if(!nombre) return;

        const { db, collection, getDocs, query, orderBy } = fb();
        const snap = await getDocs(query(collection(db,"clientes"), orderBy("nombre","asc")));
        setClientes(snap.docs.map(d=>({id:d.id,...d.data()})));
      }

      async function guardar() {
        if (!nombre.trim()) return alert("Ingresá el nombre del cliente");
        setGuardando(true);
        const { db, collection, addDoc, doc, updateDoc, Timestamp } = fb();
        try {
          if (editando) {
            await updateDoc(doc(db,"clientes",editando), { nombre:nombre.trim(), telefono:telefono.trim(), direccion:direccion.trim(), cuentaCorriente });
          } else {
            await addDoc(collection(db,"clientes"), { nombre:nombre.trim(), telefono:telefono.trim(), direccion:direccion.trim(), cuentaCorriente, creadoEn:Timestamp.now() });
          }
          setNombre(""); setTelefono(""); setCuentaCorriente(false); setEditando(null);
          cargar();
        } catch(e) { alert("Error al guardar"); }
        setGuardando(false);
      }

      async function eliminar(id, nombre) {
        if (!confirm(`¿Eliminar a "${nombre}"? Se borrarán también sus precios guardados, cuenta corriente y movimientos CC.`)) return;
        const { db, doc, deleteDoc, collection, getDocs, query, where } = fb();
        try {
          // 1. Delete client doc
          await deleteDoc(doc(db,"clientes",id));
          
          // 2. Delete saved prices (precios_cliente)
          const lower = nombre.toLowerCase().trim();
          const snapPrecios = await getDocs(collection(db,"precios_cliente"));
          for(const d of snapPrecios.docs) {
            if(d.data().cliente && d.data().cliente.toLowerCase().trim() === lower) {
              await deleteDoc(doc(db,"precios_cliente",d.id));
            }
          }
          
          // 3. Delete CC movements (cc_movimientos)
          const snapCC = await getDocs(collection(db,"cc_movimientos"));
          for(const d of snapCC.docs) {
            if(d.data().cliente && d.data().cliente.toLowerCase().trim() === lower) {
              await deleteDoc(doc(db,"cc_movimientos",d.id));
            }
          }
          
          // 4. Delete CC account (cuentas_corrientes)
          const snapCuentas = await getDocs(collection(db,"cuentas_corrientes"));
          for(const d of snapCuentas.docs) {
            if(d.data().nombre && d.data().nombre.toLowerCase().trim() === lower) {
              await deleteDoc(doc(db,"cuentas_corrientes",d.id));
            }
          }
          
          console.log("[Clientes] Eliminado completo:", nombre);
        } catch(e) { 
          console.error("[Clientes] Error al eliminar:", e);
          alert("Error al eliminar el cliente"); 
        }
        cargar();
      }

    const EMAILJS_SVC = "service_u0mi57u";

    async function enviarEmailAlertas(alertas) {
      if (typeof emailjs === "undefined" || alertas.length === 0) return false;
      emailjs.init({ publicKey: EMAILJS_KEY });
      const fF = f => f ? new Date(f+"T00:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "-";
      const hoyStr = new Date().toLocaleDateString("es-AR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
      let body = "ALERTAS DE RECONTACTO - " + hoyStr.toUpperCase() + "\n\n";
      body += alertas.length + " cliente(s) requieren recontacto:\n\n";
      alertas.forEach((a, i) => {
        const up = a.ultimoPedido;
        const prods = (up.items||[]).map(it=>it.producto).join(", ");
        const total = (up.items||[]).reduce((s,it)=>{ const kg=it.kgReal!=null?it.kgReal:parseFloat(it.cantidad)||0; return s+kg*(parseFloat(it.precio)||0); },0);
        body += (i+1)+". "+a.cliente+"\n";
        body += "   Dias sin pedir: "+a.diasSinPedir+"d (limite: "+a.diasAlerta+"d)\n";
        body += "   Ultimo pedido: "+fF(up.fechaPedido)+" - "+prods+"\n";
        if (total>0) body += "   Monto: $"+Math.round(total).toLocaleString("es-AR")+"\n";
        body += "\n";
      });
      body += "---\nFrigorifico Sersale - Sistema de Pedidos";
      try {
        await emailjs.send(EMAILJS_SVC, EMAILJS_TPL, { message: body });
        return true;
      } catch(e) { console.error("EmailJS error:", e); return false; }
    }

    async function verificarYEnviarAlertas(alertas) {
      if (!alertas || alertas.filter(a=>a.enAlerta).length === 0) return;
      try {
        const { db, doc, getDoc, setDoc } = fb();
        const hoy = new Date().toISOString().split("T")[0];
        const ref = doc(db, "config", "ultima_alerta_email");
        const snap = await getDoc(ref);
        if (snap.exists() && snap.data().fecha === hoy) return;
        const activas = alertas.filter(a=>a.enAlerta);
        const ok = await enviarEmailAlertas(activas);
        if (ok) await setDoc(ref, { fecha: hoy, cantidad: activas.length, updatedAt: new Date().toISOString() });
      } catch(e) { console.error(e); }
    }

    // Mark client as recently contacted (removes from alerts/suggestions)
    async function marcarContacto(nombreCliente) {
      if(!nombreCliente) return;
      try {
        const { db, collection, getDocs, query, where, doc, updateDoc, addDoc } = fb();
        const lower = nombreCliente.toLowerCase().trim();
        // Find client doc by case-insensitive name match
        const snap = await getDocs(collection(db,"clientes"));
        let found = null;
        snap.docs.forEach(d => {
          const data = d.data();
          if(data.nombre && data.nombre.toLowerCase().trim() === lower) found = d;
        });
        if(found) {
          await updateDoc(doc(db,"clientes",found.id), { 
            ultimoContacto: new Date().toISOString(),
            ultimoPedidoRegistrado: new Date().toISOString().split("T")[0]
          });
          console.log("[Contacto] Marked as contacted:", nombreCliente);
        } else {
          // Client not in clientes collection - create entry
          await addDoc(collection(db,"clientes"), {
            nombre: nombreCliente,
            telefono: "",
            direccion: "",
            cuentaCorriente: false,

    // ── SELECTOR DE CLIENTE BUSCABLE (con búsqueda + orden alfabético) ──
    function SelectorClienteBuscable({ valor, onChange, clientes, placeholder }) {
      const [abierto, setAbierto] = useState(false);
      const [busqueda, setBusqueda] = useState("");
      const refContenedor = React.useRef(null);
      const refInput = React.useRef(null);

      useEffect(()=>{
        function handleClickFuera(e) {
          if (refContenedor.current && !refContenedor.current.contains(e.target)) {
            setAbierto(false); setBusqueda("");
          }
        }
        if (abierto) document.addEventListener("mousedown", handleClickFuera);
        return ()=>document.removeEventListener("mousedown", handleClickFuera);
      },[abierto]);

      useEffect(()=>{
        if (abierto && refInput.current) refInput.current.focus();
      },[abierto]);

      // Separar "Otro" del resto y ordenar el resto alfabéticamente
      const tieneOtro = clientes.includes("Otro");
      const resto = clientes.filter(c=>c!=="Otro").sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
      const ordenados = tieneOtro ? [...resto, "Otro"] : resto;

      const q = busqueda.toLowerCase().trim();
      const filtrados = q ? ordenados.filter(c=>c.toLowerCase().includes(q)) : ordenados;

      function seleccionar(c) {
        onChange(c);
        setAbierto(false);
        setBusqueda("");
      }

      return (
        <div ref={refContenedor} style={{position:"relative",marginBottom:8}}>
          <button type="button" onClick={()=>setAbierto(!abierto)}
            style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{color:valor?"#191E23":"#79828B"}}>{valor || (placeholder || "— Seleccioná un cliente —")}</span>
            <span style={{color:"#79828B",fontSize:12,marginLeft:8}}>{abierto?"▲":"▼"}</span>
          </button>
          {abierto && (
            <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1.5px solid #D8DCE0",borderRadius:12,boxShadow:"0 8px 24px rgba(0,0,0,0.12)",zIndex:1000,maxHeight:320,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{position:"relative",padding:8,borderBottom:"1px solid #E4E7EA"}}>
                <input ref={refInput}
                  style={{width:"100%",padding:"8px 12px 8px 32px",borderRadius:8,border:"1.5px solid #D8DCE0",fontSize:14,outline:"none",boxSizing:"border-box"}}
                  placeholder="Buscar cliente..."
                  value={busqueda} onChange={e=>setBusqueda(e.target.value)} />
                <span style={{position:"absolute",left:18,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#A3ABB3"}}>🔍</span>
              </div>
              <div style={{overflowY:"auto",flex:1}}>
                {filtrados.length===0
                  ? <div style={{padding:"16px 14px",textAlign:"center",color:"#A3ABB3",fontSize:13}}>Sin resultados</div>
                  : filtrados.map(c=>(
                    <button key={c} type="button" onClick={()=>seleccionar(c)}
                      style={{width:"100%",padding:"10px 14px",border:"none",background:c===valor?"#F7EAEA":"#fff",textAlign:"left",cursor:"pointer",fontSize:14,color:c==="Otro"?"#6B4E8E":"#191E23",fontWeight:c===valor||c==="Otro"?600:400,borderBottom:"1px solid #F2F3F5"}}
                      onMouseEnter={e=>{ if(c!==valor) e.currentTarget.style.background="#F7F8F9"; }}
                      onMouseLeave={e=>{ if(c!==valor) e.currentTarget.style.background="#fff"; }}>
                      {c==="Otro" ? "➕ Otro (cliente nuevo)" : c}
                    </button>
                  ))
                }
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── NUEVO PEDIDO ────────────────────────────────────────
    // ── BUSCADOR RÁPIDO DE PRODUCTOS ─────────────────────────
    // Busca en todo el catálogo sin pasar por categoría. Tolera acentos
    // y permite varias palabras sueltas ("crudo hueso" → "Jamón Crudo c/ Hueso").
    function BuscadorProductos({ onElegir, yaElegidos }) {
      const [q, setQ] = useState("");
      const [marcado, setMarcado] = useState(0);
      const refInput = React.useRef(null);
      const refLista = React.useRef(null);

      const normalizar = t => (t||"").toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();

      // Catálogo plano: producto + su categoría
      const catalogo = React.useMemo(()=>{
        const out = [];
        Object.entries(getProductos()).forEach(([cat, prods])=>{
          (prods||[]).forEach(prod=>{ if(prod) out.push({prod, cat, norm:normalizar(prod), normCat:normalizar(cat)}); });
        });
        return out;
      },[]);

      const resultados = React.useMemo(()=>{
        const term = normalizar(q);
        if(!term) return [];
        const palabras = term.split(" ");
        return catalogo
          .map(e=>{
            const texto = e.norm + " " + e.normCat;
            if(!palabras.every(w=>texto.includes(w))) return null;
            // Prioridad: empieza con lo buscado > lo tiene el nombre > solo la categoría
            let peso = 2;
            if(e.norm.startsWith(term)) peso = 0;
            else if(e.norm.includes(term)) peso = 1;
            return {...e, peso};
          })
          .filter(Boolean)
          .sort((a,b)=> a.peso!==b.peso ? a.peso-b.peso : a.prod.localeCompare(b.prod,"es"))
          .slice(0,8);
      },[q, catalogo]);

      useEffect(()=>{ setMarcado(0); },[q]);

      // Mantener a la vista el resultado marcado con las flechas
      useEffect(()=>{
        if(!refLista.current) return;
        const fila = refLista.current.children[marcado];
        if(fila && fila.scrollIntoView) fila.scrollIntoView({block:"nearest"});
      },[marcado]);

      function elegir(r) {
        onElegir(r.cat, r.prod);
        setQ("");
        setMarcado(0);
        if(refInput.current) refInput.current.focus();
      }

      function onKeyDown(e) {
        if(!resultados.length) return;
        if(e.key==="ArrowDown"){ e.preventDefault(); setMarcado(m=>(m+1)%resultados.length); }
        else if(e.key==="ArrowUp"){ e.preventDefault(); setMarcado(m=>(m-1+resultados.length)%resultados.length); }
        else if(e.key==="Enter"){ e.preventDefault(); elegir(resultados[marcado]); }
        else if(e.key==="Escape"){ setQ(""); }
      }

      return (
        <div style={{marginBottom:10}}>
          <div style={{position:"relative"}}>
            <input ref={refInput} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKeyDown}
              placeholder="Buscar producto y agregarlo..."
              style={{width:"100%",padding:"12px 14px 12px 38px",borderRadius:12,
                border:"1.5px solid "+(q?"#A4232A":"#D8DCE0"),fontSize:14,background:"#fff",
                outline:"none",boxSizing:"border-box",fontFamily:"inherit"}} />
            <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#A3ABB3"}}>🔍</span>
            {q && (
              <button type="button" onClick={()=>{setQ(""); if(refInput.current) refInput.current.focus();}}
                style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",border:"none",
                  background:"none",color:"#A3ABB3",fontSize:15,cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
            )}
          </div>
          {q && (
            <div style={{marginTop:6,background:"#fff",border:"1.5px solid #D8DCE0",borderRadius:12,
              overflow:"hidden",boxShadow:"0 8px 24px rgba(18,22,26,0.10)"}}>
              {resultados.length===0
                ? <div style={{padding:"14px",textAlign:"center",color:"#A3ABB3",fontSize:13}}>
                    Sin resultados — podés cargarlo con el selector de abajo
                  </div>
                : <div ref={refLista} style={{maxHeight:260,overflowY:"auto"}}>
                    {resultados.map((r,idx)=>{
                      const repetido = (yaElegidos||[]).includes(r.prod);
                      return (
                        <button key={r.cat+"|"+r.prod} type="button"
                          onClick={()=>elegir(r)} onMouseEnter={()=>setMarcado(idx)}
                          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
                            gap:10,padding:"10px 13px",border:"none",cursor:"pointer",textAlign:"left",
                            borderBottom:idx<resultados.length-1?"1px solid #F2F3F5":"none",
                            background:idx===marcado?"#F7EAEA":"#fff",fontFamily:"inherit"}}>
                          <span style={{minWidth:0}}>
                            <span style={{display:"block",fontSize:13.5,fontWeight:600,color:"#191E23"}}>{r.prod}</span>
                            <span style={{display:"block",fontSize:11,color:"#79828B",marginTop:1}}>{r.cat}</span>
                          </span>
                          <span style={{flexShrink:0,fontSize:11,fontWeight:700,
                            color:repetido?"#A8702A":"#A4232A"}}>{repetido?"ya está":"+ agregar"}</span>
                        </button>
                      );
                    })}
                  </div>
              }
              <div style={{padding:"7px 13px",background:"#F7F8F9",borderTop:"1px solid #F2F3F5",
                fontSize:10.5,color:"#A3ABB3"}}>Enter agrega · ↑↓ para moverte · Esc limpia</div>
            </div>
          )}
        </div>
      );
    }

    function NuevoPedido({ onBack, onSaved }) {
      const [cliente, setCliente] = useState("");
      const [clienteCustom, setClienteCustom] = useState("");
      const [cuentaCorriente, setCuentaCorriente] = useState(false);
      const [entrega, setEntrega] = useState("");
      const [items, setItems] = useState([{categoria:"",producto:"",cantidad:"",unidad:"kg",obs:""}]);
      const [tipo, setTipo] = useState("");
      const [obsGeneral, setObsGeneral] = useState("");
      const [guardando, setGuardando] = useState(false);
      const [clientesDB, setClientesDB] = useState([]);
      const [saldoCC, setSaldoCC] = useState(null);

      useEffect(()=>{
        async function cargarClientes() {
          const { db, collection, getDocs, query, orderBy } = fb();
          const snap = await getDocs(query(collection(db,"clientes"), orderBy("nombre","asc")));
          setClientesDB(snap.docs.map(d=>({id:d.id,...d.data()})));
        }
        if(window.__fbReady) cargarClientes(); else document.addEventListener("fbReady",cargarClientes);
      },[]);

      // Al seleccionar cliente, auto-marcar cuenta corriente si corresponde
      async function onSelectCliente(val) {
        setCliente(val);
        setSaldoCC(null);
        const found = clientesDB.find(c=>c.nombre===val);
        if (found) {
          setCuentaCorriente(!!found.cuentaCorriente);
          if (found.cuentaCorriente) {
            try {
              const { db, collection, getDocs, query, where } = fb();
              const snap = await getDocs(query(collection(db,"cuentas_corrientes"), where("nombre","==",val)));
              if (!snap.empty) setSaldoCC(snap.docs[0].data().saldo||0);
            } catch(e){}
          }
        } else setCuentaCorriente(false);
      }

      const addItem = () => setItems([...items,{categoria:"",producto:"",cantidad:"",unidad:"kg",obs:""}]);

      // Alta desde el buscador: reutiliza la última fila si quedó vacía
      function agregarDesdeBuscador(categoria, producto) {
        setItems(prev => {
          const ultimo = prev[prev.length-1];
          const filaVacia = ultimo && !ultimo.producto && !ultimo.cantidad;
          const nueva = {categoria, producto, cantidad:"", unidad:"kg", obs:""};
          return filaVacia ? [...prev.slice(0,-1), nueva] : [...prev, nueva];
        });
      }
      const updItem = (i,f,v) => { const c=[...items]; c[i][f]=v; if(f==="categoria") c[i].producto=""; setItems(c); };
      const remItem = i => setItems(items.filter((_,idx)=>idx!==i));

      // Lista combinada: clientes de Firebase + lista base + Otro
      const todosClientes = [
        ...clientesDB.map(c=>c.nombre),
        ...CLIENTES_DEFAULT.filter(d=>!clientesDB.find(c=>c.nombre===d)),
        "Otro"
      ];

      async function guardar() {
        const nombreCliente = cliente==="Otro" ? clienteCustom.trim() : cliente;
        if (!nombreCliente) return alert("Seleccioná o ingresá el cliente");
        if (!tipo) return alert("Seleccioná si es envío o retiro");
        if (!entrega) return alert("Ingresá la fecha de entrega");
        const val = items.filter(it=>it.producto&&it.cantidad);
        if (!val.length) return alert("Agregá al menos un producto");
        setGuardando(true);
        try {
          const { db, collection, addDoc, Timestamp } = fb();
          await addDoc(collection(db,"pedidos"), {
            cliente: nombreCliente, cuentaCorriente, tipo,
            fechaPedido: Timestamp.now(),
            fechaPedidoISO: new Date().toISOString(),
            fechaEntrega: entrega,
            items: val, obs: obsGeneral.trim(),
            estado: "pendiente",
            historial: [{estado:"pendiente", fecha:new Date().toISOString(), nota:"Pedido creado"}]
          });
          // Si tiene CC, registrar el movimiento automáticamente (aunque no tenga precio aún)
          if(cuentaCorriente) {
            try {
              const { getDocs: gD, query: q2, where: w2, updateDoc: uD, doc: d2, addDoc: aC2 } = fb();
              const totalPedido = val.reduce((s,it)=>{
                const kg=it.kgReal!=null?it.kgReal:parseFloat(it.cantidad)||0;
                return s+(kg*(parseFloat(it.precio)||0));
              },0);
              const productos = val.map(it=>it.producto).join(", ");
              const ccMovData = {
                cliente:nombreCliente, tipo:"pedido",
                monto:Math.round(totalPedido), movimiento:Math.round(totalPedido),
                fecha:entrega||new Date().toISOString().split("T")[0],
                detalle:productos, obs:totalPedido<=0?"Pendiente de facturar":"",
                origen:"pedido_app", createdAt:new Date().toISOString()
              };
              await aC2(collection(db,"cc_movimientos"), ccMovData);
              // Actualizar saldo solo si hay monto real
              if(totalPedido > 0) {
                const snapMovs = await gD(q2(collection(db,"cc_movimientos"),w2("cliente","==",nombreCliente)));
                let saldo=0;
                snapMovs.docs.forEach(dd=>{ const m=dd.data(); if(m.monto>0) saldo+=m.tipo==="pedido"?m.monto:-m.monto; });
                const snapCC = await gD(q2(collection(db,"cuentas_corrientes"),w2("nombre","==",nombreCliente)));
                if(!snapCC.empty) await uD(d2(db,"cuentas_corrientes",snapCC.docs[0].id),{saldo:Math.round(saldo),ultimoMovimiento:entrega||new Date().toISOString().split("T")[0]});
              }
            } catch(e){ console.error("Error CC:", e); }
          }
          // Mark client as contacted for alerts/suggestions
          marcarContacto(nombreCliente);
          onSaved();
        } catch(e) { alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }

      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"18px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 4px 20px rgba(192,57,43,0.35)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1,fontWeight:800,fontSize:16}}>Nuevo Pedido</div>
          </div>
          <div style={{padding:20}}>
            <label style={{display:"block",fontWeight:600,fontSize:13,color:"#3A424A",marginBottom:6}}>Cliente</label>
            <SelectorClienteBuscable valor={cliente} onChange={onSelectCliente} clientes={todosClientes} />
            {cliente==="Otro" && (
              <input style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:8}}
                placeholder="Nombre del cliente" value={clienteCustom} onChange={e=>setClienteCustom(e.target.value)} />
            )}
            {saldoCC !== null && (
              <div style={{borderRadius:12,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:8,
                background:saldoCC>50000?"#F7EAEA":saldoCC>0?"#F3EEE2":"#E9F0EC",
                border:`1.5px solid ${saldoCC>50000?"#C33039":saldoCC>0?"#B5872F":"#2F6B4F"}`}}>
                <span style={{fontSize:18}}>{saldoCC>50000?"⚠️":saldoCC>0?"💳":"✅"}</span>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:saldoCC>50000?"#A4232A":saldoCC>0?"#A8702A":"#2F6B4F"}}>
                    {saldoCC>0 ? "Saldo pendiente: $"+Math.round(saldoCC).toLocaleString("es-AR") : "Cuenta corriente al día"}
                  </div>
                  {saldoCC>50000&&<div style={{fontSize:11,color:"#C33039"}}>Este cliente tiene deuda elevada</div>}
                </div>
              </div>
            )}
            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,cursor:"pointer"}}>
              <input type="checkbox" checked={cuentaCorriente} onChange={e=>setCuentaCorriente(e.target.checked)} style={{width:18,height:18}} />
              <span style={{fontSize:14,color:"#3A424A"}}>Cliente con cuenta corriente</span>
            </label>
            <label style={{display:"block",fontWeight:600,fontSize:13,color:"#3A424A",marginBottom:8}}>Tipo de pedido *</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              {[["envio","🚚 Envío / Reparto"],["retiro","🏪 Retira por local"]].map(([k,lbl])=>(
                <button key={k} onClick={()=>setTipo(k)}
                  style={{padding:"14px 10px",borderRadius:12,border:`2px solid ${tipo===k?"#A4232A":"#D8DCE0"}`,
                    background:tipo===k?"#F7EAEA":"#fff",color:tipo===k?"#A4232A":"#5C666F",
                    fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center"}}>
                  {lbl}
                </button>
              ))}
            </div>
            <label style={{display:"block",fontWeight:600,fontSize:13,color:"#3A424A",marginBottom:6}}>Fecha de entrega</label>
            <input type="date" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:16}}
              value={entrega} onChange={e=>setEntrega(e.target.value)} min={today()} />
            <p style={{fontWeight:700,fontSize:13,color:"#5C666F",textTransform:"uppercase",letterSpacing:1,margin:"0 0 10px"}}>Productos</p>
            <BuscadorProductos onElegir={agregarDesdeBuscador} yaElegidos={items.map(it=>it.producto).filter(Boolean)} />
            {items.map((item,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:14,border:"1.5px solid #A4232A",padding:14,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontWeight:600,color:"#A4232A",fontSize:13}}>Ítem {i+1}</span>
                  {items.length>1 && <button onClick={()=>remItem(i)} style={{background:"#fee",color:"#A4232A",border:"1px solid #fcc",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:12}}>✕</button>}
                </div>

                        value={item.producto} onChange={e=>updItem(i,"producto",e.target.value)}>

    // ── VISTA COMERCIAL ─────────────────────────────────────
    function VistaComercial({ onBack, onRefreshParent }) {
      const [tab, setTab] = useState("pedidos");
      const [pedidos, setPedidos] = useState(null);
      const [mostrarNuevo, setMostrarNuevo] = useState(false);
      const [mostrarClientes, setMostrarClientes] = useState(false);
      const [mostrarProductos, setMostrarProductos] = useState(false);
      const [saldoCC, setSaldoCC] = useState(null); // null=sin CC, number=saldo
      const [editandoPedido, setEditandoPedido] = useState(null);
      const [remitoPedido, setRemitoPedido] = useState(null);
      const lastSeen = getLastSeen();

      async function cargar() {
        const { db, collection, query, getDocs, orderBy } = fb();
        const snap = await getDocs(query(collection(db,"pedidos"), orderBy("fechaPedido","desc")));
        setPedidos(snap.docs.map(d=>({id:d.id,...d.data()})));
        if(onRefreshParent) setTimeout(()=>onRefreshParent(), 800);
      }

      async function cambiarEstado(id, nuevoEstado, itemsConKg=null) {
        const { db, doc, updateDoc } = fb();
        const pedido = pedidos.find(p=>p.id===id);
        const upd = {
          estado: nuevoEstado,
          historial:[...(pedido.historial||[]),{estado:nuevoEstado,fecha:new Date().toISOString()}]
        };
        if(itemsConKg) upd.items = itemsConKg;
        await updateDoc(doc(db,"pedidos",id), upd);
        cargar();
      }

      useEffect(()=>{
        if(window.__fbReady) cargar(); else document.addEventListener("fbReady",cargar);
      },[]);

      if (mostrarNuevo) return <NuevoPedido onBack={()=>setMostrarNuevo(false)} onSaved={()=>{ setMostrarNuevo(false); cargar(); }} />;
      if (mostrarClientes) return <GestionClientes onBack={()=>setMostrarClientes(false)} />;
      if (mostrarProductos) return <GestionProductos onBack={()=>setMostrarProductos(false)} />;
      if (editandoPedido) return <EditarPedido pedido={editandoPedido} onBack={()=>setEditandoPedido(null)} onSaved={()=>{ setEditandoPedido(null); cargar(); }} />;
      if (remitoPedido) return <RemitoPedido pedido={remitoPedido} onBack={()=>setRemitoPedido(null)} />;

      const activos   = (pedidos||[]).filter(p=>!["despachado","cancelado"].includes(p.estado));
      const historial = (pedidos||[]).filter(p=>["despachado","cancelado"].includes(p.estado));

      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"18px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 4px 20px rgba(192,57,43,0.35)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1,fontWeight:800,fontSize:16}}>Comercial</div>
            <button onClick={()=>setMostrarClientes(true)} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.4)",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,fontWeight:700}}>👥</button>
            <button onClick={()=>setMostrarProductos(true)} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.4)",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,fontWeight:700}}>🥩</button>
            <button onClick={()=>setMostrarNuevo(true)} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.4)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:700}}>+ Nuevo</button>
          </div>
          <div style={{display:"flex",borderBottom:"2px solid #D8DCE0",background:"#fff",overflowX:"auto",scrollBehavior:"smooth",WebkitOverflowScrolling:"touch"}}>
            {[["pedidos",`Activos (${activos.length})`],["historial",`Historial (${historial.length})`]].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"12px 0",border:"none",background:"none",fontWeight:700,fontSize:14,color:tab===k?"#A4232A":"#8A929A",borderBottom:tab===k?"3px solid #A4232A":"3px solid transparent",cursor:"pointer",fontWeight:tab===k?700:500}}>{l}</button>
            ))}
          </div>
          <div style={{padding:16}}>
            {pedidos===null ? <p style={{textAlign:"center",color:"#79828B",marginTop:40}}>Cargando...</p>
            : tab==="pedidos"
              ? <ActivosFiltrados activos={activos} cambiarEstado={cambiarEstado} lastSeen={lastSeen} onEditar={setEditandoPedido} onRemito={setRemitoPedido} />
              : <HistorialFiltrado historial={historial} cambiarEstado={cambiarEstado} />
            }
          </div>
        </div>
      );
    }

    // ── EDITAR PEDIDO ───────────────────────────────────────
    function EditarPedido({ pedido, onBack, onSaved }) {
      const [cliente, setCliente] = useState(pedido.cliente||"");
      const [clienteCustom, setClienteCustom] = useState("");
      const [cuentaCorriente, setCuentaCorriente] = useState(!!pedido.cuentaCorriente);
      const [tipo, setTipo] = useState(pedido.tipo||"");
      const [entrega, setEntrega] = useState(pedido.fechaEntrega||"");
      const [items, setItems] = useState(pedido.items.map(it=>({...it})));
      const [obsGeneral, setObsGeneral] = useState(pedido.obs||"");
      const [guardando, setGuardando] = useState(false);
      const [clientesDB, setClientesDB] = useState([]);

      useEffect(()=>{
        async function cargarClientes() {
          const { db, collection, getDocs, query, orderBy } = fb();
          const snap = await getDocs(query(collection(db,"clientes"), orderBy("nombre","asc")));
          setClientesDB(snap.docs.map(d=>({id:d.id,...d.data()})));
        }
        if(window.__fbReady) cargarClientes(); else document.addEventListener("fbReady",cargarClientes);
      },[]);

      const addItem = () => setItems([...items,{categoria:"",producto:"",cantidad:"",unidad:"kg",obs:""}]);

      // Alta desde el buscador: reutiliza la última fila si quedó vacía
      function agregarDesdeBuscador(categoria, producto) {
        setItems(prev => {
          const ultimo = prev[prev.length-1];
          const filaVacia = ultimo && !ultimo.producto && !ultimo.cantidad;
          const nueva = {categoria, producto, cantidad:"", unidad:"kg", obs:""};
          return filaVacia ? [...prev.slice(0,-1), nueva] : [...prev, nueva];
        });
      }
      const updItem = (i,f,v) => { const c=[...items]; c[i][f]=v; if(f==="categoria") c[i].producto=""; setItems(c); };
      const remItem = i => setItems(items.filter((_,idx)=>idx!==i));

      const todosClientes = [
        ...clientesDB.map(c=>c.nombre),
        ...CLIENTES_DEFAULT.filter(d=>!clientesDB.find(c=>c.nombre===d)),
        "Otro"
      ];
      // If current cliente isn't in list, treat as custom
      const clienteEnLista = todosClientes.includes(cliente);
      const [clienteSelect, setClienteSelect] = useState(clienteEnLista ? cliente : "Otro");
      useEffect(()=>{
        if(!clienteEnLista) setClienteCustom(cliente);
      },[]);

      async function guardar() {
        const nombreCliente = clienteSelect==="Otro" ? clienteCustom.trim() : clienteSelect;
        if (!nombreCliente) return alert("Seleccioná o ingresá el cliente");
        if (!tipo) return alert("Seleccioná si es envío o retiro");
        if (!entrega) return alert("Ingresá la fecha de entrega");
        const val = items.filter(it=>it.producto&&it.cantidad);
        if (!val.length) return alert("Agregá al menos un producto");
        setGuardando(true);
        try {
          const { db, doc, updateDoc } = fb();
          await updateDoc(doc(db,"pedidos",pedido.id), {
            cliente: nombreCliente, cuentaCorriente, tipo,
            fechaEntrega: entrega, items: val, obs: obsGeneral.trim(),
            editadoEn: new Date().toISOString()
          });
          onSaved();
        } catch(e) { alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }

      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"18px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 4px 20px rgba(192,57,43,0.35)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1,fontWeight:800,fontSize:16}}>Editar Pedido</div>
          </div>
          <div style={{padding:20}}>
            <label style={{display:"block",fontWeight:600,fontSize:13,color:"#3A424A",marginBottom:6}}>Cliente</label>
            <select style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:8}}
              value={clienteSelect} onChange={e=>{ setClienteSelect(e.target.value); if(e.target.value!=="Otro") setCliente(e.target.value); }}>
              <option value="">— Seleccioná un cliente —</option>
              {todosClientes.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            {clienteSelect==="Otro" && (

            {items.map((item,i)=>(

                  {Object.keys(getProductos()).sort((a,b)=>a.localeCompare(b,"es")).map(cat=><option key={cat} value={cat}>{cat}</option>)}

                {item.categoria && (
                  item.categoria === "Artículos Varios"
                    ? <input style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:8}}
                        placeholder="Descripción del artículo" value={item.producto} onChange={e=>updItem(i,"producto",e.target.value)} />
                    : <select style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",marginBottom:8}}

                  <select style={{width:110,padding:"12px 10px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none"}}
                    value={item.unidad} onChange={e=>updItem(i,"unidad",e.target.value)}>

                  </select>

                <input style={{width:"100%",padding:"10px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff",marginTop:8}}
                  placeholder="Observación (opcional)" value={item.obs||""} onChange={e=>updItem(i,"obs",e.target.value)} />

            ))}
            <button onClick={addItem} style={{width:"100%",padding:12,borderRadius:12,border:"2px dashed #2A333B",background:"transparent",cursor:"pointer",fontWeight:600,fontSize:14,color:"#2A333B",marginBottom:16}}>

            </button>
            <label style={{display:"block",fontWeight:600,fontSize:13,color:"#3A424A",marginBottom:6}}>Observaciones generales</label>
            <textarea style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",height:70,resize:"none"}}

            <button onClick={guardar} disabled={guardando}
              style={{width:"100%",padding:16,borderRadius:14,border:"none",background:guardando?"#B9BFC5":"#2A333B",color:"#fff",fontWeight:800,fontSize:16,cursor:"pointer",marginTop:12}}>

    }

    // ── REMITO PEDIDO ───────────────────────────────────────
    function RemitoPedido({ pedido, onBack }) {
      const { useState, useEffect } = React;
      const [precios, setPrecios] = useState({});
      const [nroRemito, setNroRemito] = useState("");
      const [guardando, setGuardando] = useState(false);
      const [guardado, setGuardado] = useState(false);

      // Load saved prices for this client
      useEffect(()=>{
        async function cargar() {
          try {
            const { db, collection, getDocs, query, where } = fb();
            // Try exact match first, then case-insensitive fallback
            let snap = await getDocs(query(collection(db,"precios_cliente"),
              where("cliente","==",pedido.cliente)));
            if(snap.empty) {
              // Case-insensitive fallback: fetch all and filter
              const snapAll = await getDocs(collection(db,"precios_cliente"));
              const lower = pedido.cliente.toLowerCase().trim();
              const matching = snapAll.docs.filter(d => {
                const c = d.data().cliente;
                return c && c.toLowerCase().trim() === lower;
              });
              snap = { docs: matching, empty: matching.length === 0 };
            }
            const sorted = snap.docs.map(d=>({...(d.data ? d.data() : d)})).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
            const latest = {};
            sorted.forEach(data=>{
              if(!latest[data.producto]) latest[data.producto] = data.precio;
            });
            setPrecios(latest);
            if(Object.keys(latest).length > 0) console.log("[Remito] Precios cargados:", Object.keys(latest).length, "productos para", pedido.cliente);
          } catch(e){ console.error("Error cargando precios:", e); }
        }
        // Load next remito number from atomic counter
        async function cargarNro() {
          try {
            const { db, doc, getDoc, setDoc, collection, getDocs } = fb();
            // Read counter doc
            const counterRef = doc(db, "config", "contador_remitos");
            const counterSnap = await getDoc(counterRef);
            if(counterSnap.exists()) {
              setNroRemito(String((counterSnap.data().ultimo||0)+1).padStart(4,"0"));
            } else {
              // First time: scan existing remitos to initialize counter
              const snap = await getDocs(collection(db,"remitos"));
              let maxNro = 0;
              snap.docs.forEach(d=>{ const n = d.data().nro||0; if(n>maxNro) maxNro=n; });
              await setDoc(counterRef, { ultimo: maxNro, updatedAt: new Date().toISOString() });
              setNroRemito(String(maxNro+1).padStart(4,"0"));
            }
          } catch(e){ console.error("Error cargarNro:", e); setNroRemito("0001"); }
        }
        if(window.__fbReady){ cargar(); cargarNro(); }
        else document.addEventListener("fbReady",()=>{ cargar(); cargarNro(); });
      },[]);

      async function guardarRemito() {
        setGuardando(true);
        try {
          const { db, collection, addDoc, getDocs, query, orderBy, where, doc, getDoc, updateDoc, setDoc, increment } = fb();
          // Atomically reserve the next remito number
          let nroFinal = parseInt(nroRemito)||0;
          try {
            const counterRef = doc(db, "config", "contador_remitos");
            const counterSnap = await getDoc(counterRef);
            if(counterSnap.exists()) {
              nroFinal = (counterSnap.data().ultimo||0) + 1;
              await updateDoc(counterRef, { ultimo: nroFinal, updatedAt: new Date().toISOString() });
            } else {
              await setDoc(counterRef, { ultimo: nroFinal, updatedAt: new Date().toISOString() });
            }
            setNroRemito(String(nroFinal).padStart(4,"0"));
          } catch(e) { console.error("Error reservando nro remito:", e); }
          // Save remito
          await addDoc(collection(db,"remitos"), {
            nro: nroFinal,
            pedidoId: pedido.id,
            cliente: pedido.cliente,
            fecha: new Date().toISOString().split("T")[0],
            items: pedido.items.map(it=>({
              producto: it.producto,
              kg: it.kgReal||it.cantidad||0,
              unidad: it.unidad,
              precio: parseFloat(precios[it.producto])||0,
              total: (it.kgReal||parseFloat(it.cantidad)||0) * (parseFloat(precios[it.producto])||0)
            })),
            total: pedido.items.reduce((s,it)=>{
              const kg = it.kgReal||parseFloat(it.cantidad)||0;
              const p = parseFloat(precios[it.producto])||0;
              return s + kg*p;
            },0),
            createdAt: new Date().toISOString()
          });
          // Save prices per client
          for(const it of pedido.items) {
            const p = parseFloat(precios[it.producto]);
            if(p>0) {
              await addDoc(collection(db,"precios_cliente"), {
                cliente: pedido.cliente,
                producto: it.producto,
                precio: p,
                fecha: new Date().toISOString()
              });
            }
          }
          // ── Actualizar CC con el total real del remito ──
          // Check both pedido flag AND if client has CC account
          // Check CC: exact match first, then case-insensitive
          let ccDocId = null;
          const clienteTieneCC = pedido.cuentaCorriente || await (async()=>{
            try {
              const snapCC2 = await getDocs(collection(db,"cuentas_corrientes"));
              const lower = pedido.cliente.toLowerCase().trim();
              const match = snapCC2.docs.find(d => {
                const n = d.data().nombre;
                return n && n.toLowerCase().trim() === lower;
              });
              if(match) { ccDocId = match.id; return true; }
              return false;
            } catch(e){ return false; }
          })();
          if(clienteTieneCC) {
            try {
              const montoRemito = pedido.items.reduce((s,it)=>{
                const kg = it.kgReal||parseFloat(it.cantidad)||0;
                const p = parseFloat(precios[it.producto])||0;
                return s + kg*p;
              },0);
              const montoFinal = Math.round(montoRemito);
              const hoyStr = new Date().toISOString().split("T")[0];
              const productos = pedido.items.map(it=>it.producto).join(", ");
              
              // Buscar placeholder cc_movimiento (case-insensitive)
              const lower3 = pedido.cliente.toLowerCase().trim();
              const snapAllCC = await getDocs(collection(db,"cc_movimientos"));
              let movExistente = null;
              snapAllCC.docs.forEach(d => {
                const m = d.data();
                if(m.cliente && m.cliente.toLowerCase().trim() === lower3 
                   && m.origen === "pedido_app" 
                   && m.fecha === pedido.fechaEntrega 
                   && m.monto === 0) {
                  movExistente = d;
                }
              });
              
              if(movExistente && montoFinal > 0) {
                // Actualizar el movimiento placeholder con el monto real
                await updateDoc(doc(db,"cc_movimientos",movExistente.id), {
                  monto: montoFinal,
                  movimiento: montoFinal,
                  detalle: productos,
                  obs: "Remito N° "+String(nroFinal).padStart(4,"0"),
                  remitoNro: nroFinal,
                  updatedAt: new Date().toISOString()
                });
                console.log("[Remito] CC movimiento actualizado:", montoFinal);
              } else if(montoFinal > 0) {
                // Crear nuevo movimiento CC (no habia placeholder)
                await addDoc(collection(db,"cc_movimientos"), {
                  cliente: pedido.cliente,
                  tipo: "pedido",
                  monto: montoFinal,
                  movimiento: montoFinal,
                  fecha: pedido.fechaEntrega || hoyStr,
                  detalle: productos,
                  obs: "Remito N° "+String(nroFinal).padStart(4,"0"),
                  origen: "remito",
                  remitoNro: nroFinal,
                  createdAt: new Date().toISOString()
                });
                console.log("[Remito] CC movimiento creado:", montoFinal);
              }
              
              // Recalcular saldo total del cliente (case-insensitive)
              if(montoFinal > 0) {
                const lower2 = pedido.cliente.toLowerCase().trim();
                const snapAllMovs = await getDocs(collection(db,"cc_movimientos"));
                let saldo = 0;
                snapAllMovs.docs.forEach(d => {
                  const m = d.data();
                  if(m.cliente && m.cliente.toLowerCase().trim() === lower2) {
                    saldo += m.tipo === "pedido" ? (m.monto||0) : -(m.monto||0);
                  }
                });
                // Find CC account (use ccDocId if already found, otherwise search)
                if(ccDocId) {
                  await updateDoc(doc(db,"cuentas_corrientes",ccDocId), {
                    saldo: Math.round(saldo),
                    ultimoMovimiento: hoyStr
                  });
                  console.log("[Remito] CC saldo actualizado:", saldo);
                } else {
                  const snapCC3 = await getDocs(collection(db,"cuentas_corrientes"));
                  const ccMatch = snapCC3.docs.find(d => {
                    const n = d.data().nombre;
                    return n && n.toLowerCase().trim() === lower2;
                  });
                  if(ccMatch) {
                    await updateDoc(doc(db,"cuentas_corrientes",ccMatch.id), {
                      saldo: Math.round(saldo),
                      ultimoMovimiento: hoyStr
                    });
                    console.log("[Remito] CC saldo actualizado:", saldo);
                  } else {
                    console.warn("[Remito] CC account not found for:", pedido.cliente);
                  }
                }
              }
            } catch(e) { console.error("[Remito] Error actualizando CC:", e); }
          }
          
          setGuardado(true);
          // Number already reserved atomically above
          setNroRemito(String(nroFinal+1).padStart(4,"0"));
        } catch(e){ alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }

      const totalRemito = pedido.items.reduce((s,it)=>{
        const kg = it.kgReal!=null ? it.kgReal : parseFloat(it.cantidad)||0;
        const p = parseFloat(precios[it.producto])||0;
        return s + kg*p;
      },0);

      const fmt$ = n => n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:2});

      function imprimir() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const W = doc.internal.pageSize.getWidth();
        const margin = 14;
        const pw = W - margin * 2;
        let y = 16;
        
        // Logo
        try {
          var logoB64 = window.__sersaleLogo;
          doc.addImage(logoB64, 'PNG', margin, y - 4, 18, 18);
        } catch(e){ console.error('Logo error:', e); }
        
        // Header text
        doc.setFontSize(14); doc.setTextColor(192,34,43); doc.setFont(undefined,'bold');
        doc.text('FRIGORIFICO SERSALE', margin + 22, y + 2);
        doc.setFontSize(7); doc.setTextColor(100); doc.setFont(undefined,'normal');
        doc.text('24 de Noviembre 1926, Parque Patricios - CABA', margin + 22, y + 7);
        doc.text('Tel: (011) 6763-7860 - @sersalefrigorifico', margin + 22, y + 11);
        
        // Remito number
        doc.setFontSize(9); doc.setTextColor(130); doc.setFont(undefined,'normal');
        doc.text('REMITO', W - margin, y, { align: 'right' });
        doc.setFontSize(20); doc.setTextColor(192,34,43); doc.setFont(undefined,'bold');
        doc.text('N\u00B0 ' + nroRemito, W - margin, y + 8, { align: 'right' });
        
        y += 18;
        doc.setDrawColor(192,34,43); doc.setLineWidth(0.8);
        doc.line(margin, y, W - margin, y);
        y += 6;
        
        // Info grid
        doc.setFontSize(7); doc.setTextColor(150); doc.setFont(undefined,'normal');
        doc.text('CLIENTE', margin, y);
        doc.text('FECHA', margin + pw/2, y);
        y += 4;
        doc.setFontSize(10); doc.setTextColor(30); doc.setFont(undefined,'bold');
        doc.text(pedido.cliente || '-', margin, y);
        doc.text(new Date().toLocaleDateString('es-AR'), margin + pw/2, y);
        y += 5;
        doc.setFontSize(7); doc.setTextColor(150); doc.setFont(undefined,'normal');
        doc.text('FECHA DE ENTREGA', margin, y);
        doc.text('TIPO', margin + pw/2, y);
        y += 4;
        doc.setFontSize(10); doc.setTextColor(30); doc.setFont(undefined,'bold');
        var fechaEnt = pedido.fechaEntrega ? pedido.fechaEntrega.split('-').reverse().join('/') : '-';
        doc.text(fechaEnt, margin, y);
        doc.text(pedido.tipo === 'envio' ? 'Envio / Reparto' : 'Retiro por local', margin + pw/2, y);
        y += 8;
        
        // Table header
        var colX = [margin, margin + pw*0.45, margin + pw*0.62, margin + pw*0.80];
        var colW2 = [pw*0.45, pw*0.17, pw*0.18, pw*0.20];
        doc.setFillColor(44,62,80);
        doc.rect(margin, y, pw, 7, 'F');
        doc.setFontSize(7); doc.setTextColor(255); doc.setFont(undefined,'bold');
        doc.text('PRODUCTO', colX[0] + 2, y + 5);
        doc.text('KG', colX[1] + colW2[1]/2, y + 5, { align: 'center' });
        doc.text('PRECIO / KG', colX[2] + colW2[2]/2, y + 5, { align: 'center' });
        doc.text('TOTAL', colX[3] + colW2[3] - 2, y + 5, { align: 'right' });
        y += 9;
        
        // Table rows
        doc.setFont(undefined,'normal'); doc.setTextColor(50);
        var totalRemito2 = 0;
        pedido.items.forEach(function(it) {
          var kg = it.kgReal != null ? it.kgReal : parseFloat(it.cantidad) || 0;
          var p = parseFloat(precios[it.producto]) || 0;
          var tot = kg * p;
          totalRemito2 += tot;
          doc.setFontSize(9); doc.setFont(undefined,'normal');
          doc.text(it.producto || '', colX[0] + 2, y + 4);
          doc.text(String(kg), colX[1] + colW2[1]/2, y + 4, { align: 'center' });
          doc.text(p > 0 ? fmt$(p) : '-', colX[2] + colW2[2]/2, y + 4, { align: 'center' });
          doc.setFont(undefined,'bold');
          doc.text(p > 0 ? fmt$(tot) : '-', colX[3] + colW2[3] - 2, y + 4, { align: 'right' });
          doc.setDrawColor(230); doc.setLineWidth(0.2);
          doc.line(margin, y + 6, W - margin, y + 6);
          y += 8;
        });
        
        // Total
        doc.setDrawColor(192,34,43); doc.setLineWidth(0.5);
        doc.line(margin, y, W - margin, y);
        y += 2;
        doc.setFontSize(11); doc.setTextColor(192,34,43); doc.setFont(undefined,'bold');
        doc.text('TOTAL', colX[2] + colW2[2]/2, y + 5, { align: 'center' });
        doc.text(fmt$(totalRemito2), colX[3] + colW2[3] - 2, y + 5, { align: 'right' });
        
        // Save as blob for sharing
        var fileName = 'Remito ' + nroRemito + ' - ' + (pedido.cliente||'Cliente') + ' - ' + new Date().toLocaleDateString('es-AR').replace(/\//g,'-') + '.pdf';
        window.compartirOdescargarPDF(doc, fileName);
      }


      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"16px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1,fontWeight:800,fontSize:16}}>Remito — {pedido.cliente}</div>
          </div>
          <div style={{padding:20}}>
            {/* Nro remito */}
            <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:16,marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontWeight:600,fontSize:13,color:"#3A424A"}}>N° Remito</span>
              <input style={{flex:1,padding:"10px 14px",borderRadius:8,border:"1.5px solid #D8DCE0",fontSize:18,fontWeight:700,textAlign:"center"}}
                value={nroRemito} onChange={e=>setNroRemito(e.target.value)} />
            </div>

            {/* Info cliente */}
            <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:16}}>
              <div style={{fontSize:11,color:"#79828B",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Cliente</div>
              <div style={{fontWeight:800,fontSize:16}}>{pedido.cliente}</div>
              <div style={{fontSize:12,color:"#79828B",marginTop:4}}>
                {pedido.tipo==="envio"?"🚚 Envío":"🏪 Retiro"} · Entrega: {pedido.fechaEntrega?pedido.fechaEntrega.split("-").reverse().join("/"):"-"}
              </div>
            </div>

            {/* Items con precio */}
            <p style={{fontWeight:700,fontSize:13,color:"#5C666F",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Ítems del pedido</p>
            {pedido.items.map((it,i)=>{
              const kg = it.kgReal!=null ? it.kgReal : parseFloat(it.cantidad)||0;
              const p = parseFloat(precios[it.producto])||0;
              const tot = kg*p;
              return (
                <div key={i} style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:10}}>
                  <div style={{fontWeight:600,fontSize:14,marginBottom:10}}>{it.producto}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    <div>
                      <div style={{fontSize:11,color:"#79828B",marginBottom:4}}>Kg reales</div>
                      <div style={{fontWeight:800,fontSize:16,color:"#2A333B"}}>{kg} kg</div>
                    </div>
                    <div>
                      <div style={{fontSize:11,color:"#79828B",marginBottom:4}}>Precio / kg</div>
                      <InputMonto placeholder="$ / kg"

    // ── ACTIVOS FILTRADOS (Comercial) ──────────────────────
    function ActivosFiltrados({ activos, cambiarEstado, lastSeen, onEditar, onRemito }) {
      const [subtipo, setSubtipo] = useState("todos");
      const envios  = activos.filter(p=>p.tipo==="envio");
      const retiros = activos.filter(p=>p.tipo==="retiro");
      const otros   = activos.filter(p=>!p.tipo);
      const mostrar = subtipo==="todos" ? activos 
        : subtipo==="envio" ? envios 
        : subtipo==="retiro" ? retiros 
        : subtipo==="pendiente" ? activos.filter(p=>p.estado==="pendiente")
        : subtipo==="preparando" ? activos.filter(p=>p.estado==="preparando")
        : subtipo==="listo" ? activos.filter(p=>p.estado==="listo")
        : otros;

      // Group by fechaEntrega
      const now = new Date();
      const hoy = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
      const porDia = {};
      mostrar.forEach(p => { const f=p.fechaEntrega||"Sin fecha"; if(!porDia[f])porDia[f]=[]; porDia[f].push(p); });
      const diasOrdenados = Object.keys(porDia).sort((a,b)=>{
        if(a==="Sin fecha") return 1; if(b==="Sin fecha") return -1;
        return a.localeCompare(b);
      });
      function fmtDia(f) {
        if(f==="Sin fecha") return "Sin fecha asignada";
        const fP=f.split("-").map(Number), hP=hoy.split("-").map(Number);
        const fD=new Date(fP[0],fP[1]-1,fP[2]), hD=new Date(hP[0],hP[1]-1,hP[2]);
        const diff=Math.round((fD-hD)/86400000);
        const lbl=diff===0?"HOY":diff===1?"MAÑANA":diff===-1?"AYER":diff<0?"Hace "+(-diff)+"d":"En "+diff+"d";
        return fD.toLocaleDateString("es-AR",{weekday:"long",day:"2-digit",month:"2-digit"})+" — "+lbl;
      }

      return (
        <div>
          {(() => {
            const pendientes = activos.filter(p=>p.estado==="pendiente").length;
            const preparando = activos.filter(p=>p.estado==="preparando").length;
            const listos = activos.filter(p=>p.estado==="listo").length;
            return (<div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",scrollBehavior:"smooth",WebkitOverflowScrolling:"touch",paddingBottom:2,flexWrap:"nowrap"}}>
            {[
              ["todos",`Todos (${activos.length})`],
              ["pendiente",`🔴 Pendientes (${pendientes})`],
              ["preparando",`🟡 Preparando (${preparando})`],
              ["listo",`🟢 Listos (${listos})`],
              ["envio",`🚚 Envíos (${envios.length})`],
              ["retiro",`🏪 Retiros (${retiros.length})`],
            ].map(([k,lbl])=>(
              <button key={k} onClick={()=>setSubtipo(k)}
                style={{whiteSpace:"nowrap",padding:"8px 14px",borderRadius:20,border:`1.5px solid ${subtipo===k?"#A4232A":"#D8DCE0"}`,
                  background:subtipo===k?"#A4232A":"#fff",color:subtipo===k?"#fff":"#5C666F",
                  fontWeight:600,fontSize:12,cursor:"pointer",flexShrink:0}}>
                {lbl}
              </button>
            ))}
          </div>);})()}
          {mostrar.length===0
            ? <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}><div style={{fontSize:48}}>📭</div><p>No hay pedidos en esta categoría</p></div>
            : (() => {
                const getDayColor = (fecha) => {
                  if(fecha==="Sin fecha") return "#79828B";
                  const fP=fecha.split("-").map(Number), hP=hoy.split("-").map(Number);
                  const diff=Math.round((new Date(fP[0],fP[1]-1,fP[2])-new Date(hP[0],hP[1]-1,hP[2]))/86400000);
                  return diff<0?"#C33039":diff===0?"#2F6B4F":diff===1?"#A8702A":"#26536E";
                };
                const renderDateGroup = (peds) => {
                  const pd = {};
                  peds.forEach(p => { const f=p.fechaEntrega||"Sin fecha"; if(!pd[f])pd[f]=[]; pd[f].push(p); });
                  const dias = Object.keys(pd).sort((a,b)=>{
                    if(a==="Sin fecha") return 1; if(b==="Sin fecha") return -1;
                    return a.localeCompare(b);
                  });
                  return dias.map(fecha => {
                    const dp = pd[fecha];
                    const env2 = dp.filter(p=>p.tipo==="envio").length;
                    const ret2 = dp.filter(p=>p.tipo==="retiro").length;
                    return (
                      <div key={fecha} style={{marginBottom:12}}>
                        <div style={{background:getDayColor(fecha),borderRadius:10,padding:"6px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:4}}>
                          <span style={{fontWeight:700,fontSize:12,color:"#fff",textTransform:"capitalize"}}>{fmtDia(fecha)}</span>
                          <div style={{display:"flex",gap:4,alignItems:"center"}}>

                            {ret2>0&&<span style={{fontSize:10,background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:99,padding:"2px 6px"}}>{"🏪 "+ret2}</span>}

                          </div>
                        </div>
                        {dp.map(p=><TarjetaPedido key={p.id} pedido={p} onCambiarEstado={cambiarEstado} showActions={true} isNew={p.fechaPedidoISO>lastSeen} onEditar={onEditar} onRemito={onRemito} />)}
                      </div>
                    );

                };
                const statusGroups = [
                  {key:"pendiente", label:"🔴 Pendientes", color:"#C33039", bg:"#F7EAEA"},
                  {key:"preparando", label:"🟡 En preparación", color:"#A8702A", bg:"#F3EEE2"},
                  {key:"listo", label:"🟢 Listos para despachar", color:"#2F6B4F", bg:"#E9F0EC"}

                        <span style={{fontWeight:800,fontSize:13,color:sg.color}}>{sg.label}</span>
                        <span style={{fontSize:12,fontWeight:700,color:sg.color,background:"rgba(0,0,0,0.05)",borderRadius:99,padding:"2px 10px"}}>{pedsStatus.length}</span>
                      </div>
                      {renderDateGroup(pedsStatus)}

              })()

        </div>
      );
