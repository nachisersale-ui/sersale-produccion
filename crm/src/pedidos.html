    // ── HISTORIAL FILTRADO (Comercial) ─────────────────────
    function HistorialFiltrado({ historial, cambiarEstado }) {
      const [busqCliente, setBusqCliente] = useState("");
      const [fechaDesde, setFechaDesde] = useState("");
      const [fechaHasta, setFechaHasta] = useState("");

      const clientesUnicos = [...new Set(historial.map(p=>p.cliente))].sort();

      const filtrados = historial.filter(p => {
        const matchCliente = !busqCliente || p.cliente===busqCliente;
        const matchDesde   = !fechaDesde  || p.fechaEntrega >= fechaDesde;
        const matchHasta   = !fechaHasta  || p.fechaEntrega <= fechaHasta;
        return matchCliente && matchDesde && matchHasta;
      });

      const hayFiltros = busqCliente || fechaDesde || fechaHasta;

      return (
        <div>
          {/* Filtros */}
          <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:12,color:"#79828B",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Filtrar historial</div>
            <div style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:12,color:"#5C666F",fontWeight:600,marginBottom:4}}>Cliente</label>
              <select style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none"}}
                value={busqCliente} onChange={e=>setBusqCliente(e.target.value)}>
                <option value="">Todos los clientes</option>
                {clientesUnicos.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>
                <label style={{display:"block",fontSize:12,color:"#5C666F",fontWeight:600,marginBottom:4}}>Entrega desde</label>
                <input type="date" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff"}}
                  value={fechaDesde} onChange={e=>setFechaDesde(e.target.value)} />
              </div>
              <div>
                <label style={{display:"block",fontSize:12,color:"#5C666F",fontWeight:600,marginBottom:4}}>Entrega hasta</label>
                <input type="date" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff"}}
                  value={fechaHasta} onChange={e=>setFechaHasta(e.target.value)} />
              </div>
            </div>
            {hayFiltros && (
              <button onClick={()=>{ setBusqCliente(""); setFechaDesde(""); setFechaHasta(""); }}
                style={{fontSize:12,color:"#A4232A",background:"none",border:"none",cursor:"pointer",fontWeight:600,padding:0}}>
                ✕ Limpiar filtros
              </button>
            )}
          </div>
          {/* Resultado */}
          <div style={{fontSize:12,color:"#79828B",marginBottom:10,fontWeight:600}}>
            {filtrados.length} pedido{filtrados.length!==1?"s":""}{hayFiltros?" encontrados":" en total"}
          </div>
          {filtrados.length===0
            ? <div style={{textAlign:"center",color:"#A3ABB3",marginTop:40}}><div style={{fontSize:48}}>🔍</div><p>Sin resultados para este filtro</p></div>
            : filtrados.map(p=><TarjetaPedido key={p.id} pedido={p} onCambiarEstado={cambiarEstado} showActions={false} isNew={false} />)
          }
        </div>
      );
    }

        sessionStorage.removeItem("sersale_usuario");
        sessionStorage.removeItem("sersale_nombre");
        sessionStorage.removeItem("sersale_auth");

        window.location.href = "index.html";

        const { db, collection, query, getDocs, orderBy } = fb();

        if(itemsConKg) upd.items = itemsConKg;

                            {ret>0&&<span style={{fontSize:10,background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:99,padding:"2px 6px"}}>{"🏪 "+ret}</span>}

    // ── VISTA DIRECTOR ──────────────────────────────────────
    // ── HISTORIAL CLIENTE ───────────────────────────────────
    // ── FUNCION GLOBAL: GENERAR PDF DE REMITO (reutilizable) ──
    // Acepta un objeto con: { nroRemito, cliente, fechaISO, fechaEntrega, tipo, items:[{producto,kg,precio,total}], total }
    // modoCompartir: true → intenta navigator.share; false → doc.save directo
    // ── HELPER: compartir en mobile, descargar en desktop ──
    // En desktop navigator.share suele no funcionar bien con archivos PDF,
    // entonces directamente descargamos. En mobile intentamos share nativo
    // (WhatsApp/Mail/etc) con fallback automático a descarga si falla.
    window.compartirOdescargarPDF = function(doc, fileName) {
      var ua = (navigator.userAgent||"");
      var esMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)
                  || (/Mac/i.test(ua) && navigator.maxTouchPoints > 1);
      if(esMobile && navigator.share && navigator.canShare) {
        try {
          var blob = doc.output('blob');
          var file = new File([blob], fileName, { type:'application/pdf' });
          if(navigator.canShare({ files:[file] })) {
            navigator.share({ files:[file], title:fileName })
              .catch(function(){ doc.save(fileName); });
            return;
          }
        } catch(e) { /* fall through to save */ }
      }
      doc.save(fileName);
    };

      // Logo

      doc.line(margin, y, W-margin, y);
      y += 6;

      // Info grid
      doc.setFontSize(7); doc.setTextColor(150); doc.setFont(undefined,'normal');

      doc.text(fechaEnt, margin, y);

      doc.text('PRODUCTO', colX[0]+2, y+5);

    // ── COMPONENTE TAB DIA ──────────────────────────────────
    function TabDia({ activos, lastSeen, setHojaRutaFecha }) {
      // Use local date to avoid UTC timezone issues (Argentina is UTC-3)
      const now = new Date();
      const hoy = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
      const porDia = {};
      activos.forEach(p => { const f=p.fechaEntrega||"Sin fecha"; if(!porDia[f])porDia[f]=[]; porDia[f].push(p); });
      const diasOrdenados = Object.keys(porDia).sort();
      function fmtDia(f) {
        if (f==="Sin fecha") return "Sin fecha asignada";
        // Compare dates as strings (both YYYY-MM-DD local format)
        const fParts = f.split("-").map(Number);
        const hParts = hoy.split("-").map(Number);
        const fDate = new Date(fParts[0], fParts[1]-1, fParts[2]);
        const hDate = new Date(hParts[0], hParts[1]-1, hParts[2]);
        const diff = Math.round((fDate - hDate) / 86400000);
        const lbl = diff===0?"HOY":diff===1?"MA\xd1ANA":diff===-1?"AYER":diff<0?"Hace "+(-diff)+"d":"En "+diff+"d";
        return fDate.toLocaleDateString("es-AR",{weekday:"long",day:"2-digit",month:"2-digit"})+" \u2014 "+lbl;
      }
      if (diasOrdenados.length===0) return (
        <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}>
          <div style={{fontSize:48}}>📭</div><p>Sin pedidos activos</p>
        </div>
      );
      return (
        <div>
          {diasOrdenados.map(fecha => {
            const peds = porDia[fecha];
            let diff = null;
            if(fecha!=="Sin fecha") {
              const fP = fecha.split("-").map(Number);
              const hP = hoy.split("-").map(Number);
              diff = Math.round((new Date(fP[0],fP[1]-1,fP[2]) - new Date(hP[0],hP[1]-1,hP[2])) / 86400000);
            }
            const hcolor = diff===null?"#79828B":diff<0?"#C33039":diff===0?"#2F6B4F":diff===1?"#A8702A":"#26536E";
            const envios = peds.filter(p=>p.tipo==="envio").length;
            const retiros = peds.filter(p=>p.tipo==="retiro").length;
            return (
              <div key={fecha} style={{marginBottom:20}}>
                <div style={{background:hcolor,borderRadius:12,padding:"8px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:4}}>
                  <span style={{fontWeight:700,fontSize:13,color:"#fff",textTransform:"capitalize"}}>{fmtDia(fecha)}</span>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    {envios>0&&<span style={{fontSize:11,background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:99,padding:"2px 8px"}}>{"🚚 "+envios}</span>}
                    {retiros>0&&<span style={{fontSize:11,background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:99,padding:"2px 8px"}}>{"🏪 "+retiros}</span>}
                    <span style={{fontSize:11,background:"rgba(255,255,255,0.25)",color:"#fff",borderRadius:99,padding:"2px 8px",fontWeight:700}}>{peds.length+" pedido"+(peds.length!==1?"s":"")}</span>
                    {envios>0&&fecha!=="Sin fecha"&&(
                      <button onClick={e=>{e.stopPropagation();setHojaRutaFecha(fecha);}}
                        style={{fontSize:11,background:"#fff",color:hcolor,border:"none",borderRadius:99,padding:"2px 8px",fontWeight:700,cursor:"pointer"}}>
                        Ruta
                      </button>
                    )}
                  </div>
                </div>
                {peds.map(p=><TarjetaPedido key={p.id} pedido={p} onCambiarEstado={async()=>{}} showActions={false} isNew={p.fechaPedidoISO>lastSeen} />)}
              </div>
            );
          })}
        </div>
      );
    }

        (async()=>{
          try {
            const {db,collection,getDocs,query,orderBy} = fb();
            const snap = await getDocs(query(collection(db,"clientes"),orderBy("nombre","asc")));
            const nombres = snap.docs.map(d=>d.data().nombre).filter(Boolean);
            setClientesLista(nombres);
          } catch(e){ console.error(e); }
        })();
      },[]);

      const addItem = () => setItems([...items,{producto:"",cantidad:"",unidad:"kg",precio:""}]);
      const updItem = (i,f,v) => { const a=[...items]; a[i][f]=v; setItems(a); };
      const remItem = i => items.length>1 && setItems(items.filter((_,idx)=>idx!==i));

      const total = items.reduce((s,it)=>{
        const kg = parseFloat(it.cantidad)||0;
        const p  = parseFloat(it.precio)||0;
        return s + (kg&&p ? kg*p : 0);
      },0);

      const fmt$ = n => "$"+Math.round(n).toLocaleString("es-AR");

      async function guardar() {
        if(!cliente) return alert("Seleccioná el cliente");
        const itemsValidos = items.filter(it=>it.producto.trim()&&parseFloat(it.cantidad)>0);
        if(!itemsValidos.length) return alert("Agregá al menos un producto con cantidad");
        if(total<=0) return alert("Ingresá los precios para calcular el total");
        setGuardando(true);
        try {
          const {db,collection,addDoc,getDocs,query,where,doc,updateDoc} = fb();
          const detalle = itemsValidos.map(it=>`${it.producto} ${it.cantidad}${it.unidad}`).join(", ");
          const montoFinal = Math.round(total);
          const hoy = new Date().toISOString().split("T")[0];
          // Registrar pedido en coleccion pedidos (para alertas y sugerencias)
          try {
            var tsNow = null;
            try { const ff=fb(); if(ff.Timestamp) tsNow=ff.Timestamp.now(); } catch(e2){}
            await addDoc(collection(db,"pedidos"),{
              cliente, tipo:"retiro",
              fechaPedido: tsNow || new Date(),
              fechaPedidoISO: new Date().toISOString(),
              fechaEntrega: hoy,
              items: itemsValidos.map(it=>({
                producto:it.producto.trim(),
                cantidad:parseFloat(it.cantidad),
                unidad:it.unidad,
                precio:parseFloat(it.precio)||0,
                kgReal:parseFloat(it.cantidad)
              })),
              obs: obs.trim() ? "VR: "+obs.trim() : "Venta rapida",
              estado: "despachado",
              origen: "venta_rapida",
              cuentaCorriente: true,
              historial: [{estado:"despachado", fecha:new Date().toISOString(), nota:"Venta rapida"}]
            });
          } catch(e){ console.error("Error creando pedido VR:",e); }
          // Registrar movimiento en CC
          await addDoc(collection(db,"cc_movimientos"),{
            cliente, tipo:"pedido",
            monto:montoFinal, movimiento:montoFinal,
            fecha:hoy, detalle, obs:obs.trim(),
            origen:"venta_rapida",
            items: itemsValidos.map(it=>({
              producto:it.producto.trim(),
              cantidad:parseFloat(it.cantidad),
              unidad:it.unidad,
              precio:parseFloat(it.precio)||0
            })),
            createdAt:new Date().toISOString()
          });
          // Actualizar saldo CC
          const snapMovs = await getDocs(query(collection(db,"cc_movimientos"),where("cliente","==",cliente)));
          let saldo=0;
          snapMovs.docs.forEach(d=>{ const m=d.data(); saldo+=m.tipo==="pedido"?m.monto:-m.monto; });
          const snapCC = await getDocs(query(collection(db,"cuentas_corrientes"),where("nombre","==",cliente)));
          if(!snapCC.empty) await updateDoc(doc(db,"cuentas_corrientes",snapCC.docs[0].id),{
            saldo:Math.round(saldo), ultimoMovimiento:hoy
          });
          // Mark client as contacted
          marcarContacto(cliente);
          onGuardado && onGuardado();
          onClose();
        } catch(e){ alert("Error al guardar: "+e.message); console.error(e); }
        setGuardando(false);
      }

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:10000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
          onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,maxHeight:"92vh",overflowY:"auto"}}>
            {/* Header */}
            <div style={{background:"#A4232A",padding:"18px 20px",borderRadius:"20px 20px 0 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:800,fontSize:16,color:"#fff"}}>Venta rapida</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.75)",marginTop:2}}>Registrar en cuenta corriente</div>
              </div>
              <button onClick={onClose} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:20,width:32,height:32,cursor:"pointer",fontSize:18,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
            </div>

            <div style={{padding:"16px 20px 32px"}}>
              {/* Selector de cliente (solo si no viene preseleccionado) */}
              {!clienteInicial && (
                <>
                  <label style={{display:"block",fontWeight:700,fontSize:13,color:"#3A424A",marginBottom:6}}>Cliente *</label>
                  <select style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",marginBottom:14}}
                    value={cliente} onChange={e=>setCliente(e.target.value)}>
                    <option value="">— Seleccioná un cliente —</option>
                    {(clientesLista||[]).sort().map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                </>
              )}
              {clienteInicial && (
                <div style={{background:"#F7EAEA",borderRadius:10,padding:"8px 14px",marginBottom:14,fontSize:13,color:"#7E1A20",fontWeight:700}}>
                  Cliente: {clienteInicial}
                </div>
              )}

              {/* Items */}
              <label style={{display:"block",fontWeight:700,fontSize:13,color:"#3A424A",marginBottom:8}}>Productos *</label>
              {items.map((it,i)=>(
                <div key={i} style={{background:"#F7F8F9",borderRadius:12,padding:10,marginBottom:8}}>
                  <div style={{display:"flex",gap:6,marginBottom:6}}>
                    <input style={{flex:2,padding:"9px 10px",borderRadius:9,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff"}}
                      placeholder="Producto" value={it.producto} onChange={e=>updItem(i,"producto",e.target.value)} />
                    {items.length>1&&(
                      <button onClick={()=>remItem(i)} style={{width:32,border:"none",borderRadius:9,background:"#F7EAEA",color:"#A4232A",fontSize:16,cursor:"pointer",flexShrink:0}}>×</button>
                    )}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 80px 1fr",gap:6}}>
                    <input type="number" style={{padding:"9px 10px",borderRadius:9,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff"}}
                      placeholder="Cant." value={it.cantidad} onChange={e=>updItem(i,"cantidad",e.target.value)} />
                    <select style={{padding:"9px 6px",borderRadius:9,border:"1.5px solid #D8DCE0",fontSize:12,background:"#fff"}}
                      value={it.unidad} onChange={e=>updItem(i,"unidad",e.target.value)}>
                      {["kg","pzas","bolsas","u"].map(u=><option key={u} value={u}>{u}</option>)}
                    </select>
                    <div style={{position:"relative"}}>
                      <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"#A3ABB3"}}>$</span>
                      <InputMonto style={{width:"100%",padding:"9px 10px 9px 22px",borderRadius:9,border:"1.5px solid #D8DCE0",fontSize:13,background:"#fff"}}
                        placeholder="Precio" value={it.precio} onChange={v=>updItem(i,"precio",v)} />
                    </div>
                  </div>
                </div>
              ))}
              <button onClick={addItem}
                style={{width:"100%",padding:"9px 0",borderRadius:10,border:"1.5px dashed #A4232A",background:"#F7EAEA",color:"#A4232A",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:14}}>
                + Agregar producto
              </button>

              {/* Obs */}
              <input style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:13,marginBottom:14}}
                placeholder="Observaciones (opcional)" value={obs} onChange={e=>setObs(e.target.value)} />

              {/* Total */}
              {total>0&&(
                <div style={{background:"#F0F9F4",border:"1.5px solid #2F6B4F",borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,fontSize:14,color:"#24523D"}}>Total</span>
                  <span style={{fontWeight:900,fontSize:20,color:"#24523D"}}>{fmt$(total)}</span>
                </div>
              )}

              <button onClick={guardar} disabled={guardando}
                style={{width:"100%",padding:16,borderRadius:12,border:"none",background:guardando?"#B9BFC5":"#A4232A",color:"#fff",fontWeight:800,fontSize:15,cursor:"pointer",boxShadow:"0 4px 14px rgba(192,57,43,0.4)"}}>
                {guardando?"Guardando...":"Registrar venta"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── REPORTE DE PRECIOS DE MÚLTIPLES CLIENTES (PDF) ──────
    function ReportePreciosClientes({ onBack }) {
      const [clientesLista, setClientesLista] = useState(null);
      const [seleccionados, setSeleccionados] = useState(new Set());
      const [busqueda, setBusqueda] = useState("");
      const [generando, setGenerando] = useState(false);

      useEffect(()=>{
        (async()=>{
          try {
            const {db,collection,getDocs,query,orderBy} = fb();
            const snap = await getDocs(query(collection(db,"clientes"),orderBy("nombre","asc")));
            const nombres = snap.docs.map(d=>d.data().nombre).filter(Boolean);
            // Solo clientes que tengan al menos 1 precio cargado
            const snapPrecios = await getDocs(collection(db,"precios_cliente"));
            const conPrecios = new Set();
            snapPrecios.docs.forEach(d=>{ const c=d.data().cliente; if(c) conPrecios.add(c); });
            const final = nombres.filter(n=>conPrecios.has(n)).sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
            setClientesLista(final);
          } catch(e){ console.error(e); setClientesLista([]); }
        })();
      },[]);

      function toggleCliente(nombre) {
        const s = new Set(seleccionados);
        if(s.has(nombre)) s.delete(nombre); else s.add(nombre);
        setSeleccionados(s);
      }
      function seleccionarTodos() {
        const q = busqueda.toLowerCase().trim();
        const visibles = (clientesLista||[]).filter(c=>!q || c.toLowerCase().includes(q));
        setSeleccionados(new Set(visibles));
      }
      function deseleccionarTodos() { setSeleccionados(new Set()); }

      async function generarPDF() {
        if(seleccionados.size===0) return alert("Seleccioná al menos un cliente");
        setGenerando(true);
        try {
          const {db,collection,getDocs,query,where} = fb();
          // Cargar precios de cada cliente seleccionado (en paralelo)
          const arrClientes = Array.from(seleccionados).sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
          const dataClientes = [];
          for(const nombre of arrClientes) {
            const snap = await getDocs(query(collection(db,"precios_cliente"),where("cliente","==",nombre)));
            // Deduplicar por producto: si hay varios, quedarse con el más reciente por fecha
            const mapProd = new Map();
            snap.docs.forEach(d=>{
              const data = d.data();
              if(!data.producto) return;
              const exist = mapProd.get(data.producto);
              if(!exist || (data.fecha||"") > (exist.fecha||"")) {
                mapProd.set(data.producto, data);
              }
            });
            const precios = Array.from(mapProd.values()).sort((a,b)=>a.producto.localeCompare(b.producto,"es"));
            dataClientes.push({ cliente:nombre, precios });
          }
          armarPDF(dataClientes);
        } catch(e){ alert("Error al generar PDF"); console.error(e); }
        setGenerando(false);
      }

      function armarPDF(dataClientes) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit:'mm', format:'a4' });
        const W = doc.internal.pageSize.getWidth();
        const H = doc.internal.pageSize.getHeight();
        const margin = 14;
        const pw = W - margin*2;
        const fmt$ = n => "$"+Math.round(n).toLocaleString("es-AR");
        const hoyStr = new Date().toLocaleDateString("es-AR");
        const PRODUCTOS_ACTUAL = getProductos();

        function dibujarHeader(y) {
          // Logo
          try { doc.addImage(window.__sersaleLogo, 'PNG', margin, y-4, 18, 18); } catch(e){}
          doc.setFontSize(14); doc.setTextColor(192,34,43); doc.setFont(undefined,'bold');
          doc.text('FRIGORIFICO SERSALE', margin+22, y+2);
          doc.setFontSize(7); doc.setTextColor(100); doc.setFont(undefined,'normal');
          doc.text('24 de Noviembre 1926, Parque Patricios - CABA', margin+22, y+7);
          doc.text('Tel: (011) 6763-7860 - @sersalefrigorifico', margin+22, y+11);
          // Título derecha
          doc.setFontSize(9); doc.setTextColor(130);
          doc.text('REPORTE DE PRECIOS', W-margin, y, { align:'right' });
          doc.setFontSize(11); doc.setTextColor(60); doc.setFont(undefined,'bold');
          doc.text('Generado: '+hoyStr, W-margin, y+7, { align:'right' });
          y += 18;
          doc.setDrawColor(192,34,43); doc.setLineWidth(0.8);
          doc.line(margin, y, W-margin, y);
          return y + 8;
        }

        // ── PORTADA ──
        let y = 16;
        y = dibujarHeader(y);
        doc.setFontSize(22); doc.setTextColor(44,62,80); doc.setFont(undefined,'bold');
        doc.text('Reporte de Precios', W/2, y+20, { align:'center' });
        doc.setFontSize(12); doc.setTextColor(120); doc.setFont(undefined,'normal');
        doc.text('por Cliente', W/2, y+28, { align:'center' });
        // Box con info
        doc.setFillColor(254,240,239);
        doc.roundedRect(margin+20, y+45, pw-40, 50, 3, 3, 'F');
        doc.setFontSize(10); doc.setTextColor(80); doc.setFont(undefined,'normal');
        doc.text('Fecha de generación:', margin+30, y+58);
        doc.setFont(undefined,'bold'); doc.setTextColor(40);
        doc.text(hoyStr, margin+30, y+65);
        doc.setFont(undefined,'normal'); doc.setTextColor(80);
        doc.text('Clientes incluidos:', margin+30, y+78);
        doc.setFont(undefined,'bold'); doc.setTextColor(40);
        doc.text(String(dataClientes.length), margin+30, y+85);
        // Lista de clientes incluidos (resumen)
        doc.setFontSize(9); doc.setTextColor(100); doc.setFont(undefined,'normal');
        doc.text('Clientes en este reporte:', margin, y+110);
        doc.setFontSize(10); doc.setTextColor(50);
        let yLista = y+118;
        dataClientes.forEach((d,i)=>{
          if(yLista > H-25) { doc.addPage(); yLista = 20; }
          doc.text('• '+d.cliente+' ('+d.precios.length+' precio'+(d.precios.length!==1?'s':'')+')', margin+4, yLista);
          yLista += 6;
        });

        // ── UNA PÁGINA POR CLIENTE ──
        dataClientes.forEach((d,idx)=>{
          doc.addPage();
          let y2 = 16;
          y2 = dibujarHeader(y2);
          // Header del cliente
          doc.setFillColor(192,34,43);
          doc.rect(margin, y2, pw, 12, 'F');
          doc.setFontSize(13); doc.setTextColor(255); doc.setFont(undefined,'bold');
          doc.text(d.cliente, margin+4, y2+8);
          doc.setFontSize(9); doc.setFont(undefined,'normal');
          doc.text((idx+1)+' / '+dataClientes.length, W-margin-4, y2+8, { align:'right' });
          y2 += 18;

          // Si no hay precios
          if(d.precios.length===0) {
            doc.setFontSize(10); doc.setTextColor(120); doc.setFont(undefined,'italic');
            doc.text('Sin precios cargados', margin, y2+10);
            return;
          }

          // Agrupar por categoría
          const porCat = {};
          d.precios.forEach(p=>{
            // buscar a qué categoría pertenece
            let cat = "Otros";
            for(const [c, prods] of Object.entries(PRODUCTOS_ACTUAL)) {
              if(prods.includes(p.producto)) { cat = c; break; }
            }
            if(!porCat[cat]) porCat[cat] = [];
            porCat[cat].push(p);
          });
          const catsOrdenadas = Object.keys(porCat).sort((a,b)=>a.localeCompare(b,"es"));

          // Por cada categoría: encabezado + tabla
          catsOrdenadas.forEach(cat=>{
            const items = porCat[cat].sort((a,b)=>a.producto.localeCompare(b.producto,"es"));
            // Salto de página si no entra el header + al menos 2 filas
            if(y2 + 7 + 18 > H-15) { doc.addPage(); y2 = 16; y2 = dibujarHeader(y2); }
            // Header categoría
            doc.setFillColor(240,240,240);
            doc.rect(margin, y2, pw, 6, 'F');
            doc.setFontSize(8); doc.setTextColor(100); doc.setFont(undefined,'bold');
            doc.text(cat.toUpperCase(), margin+3, y2+4.2);
            y2 += 7;
            // Header tabla
            doc.setFillColor(44,62,80);
            doc.rect(margin, y2, pw, 7, 'F');
            doc.setFontSize(8); doc.setTextColor(255); doc.setFont(undefined,'bold');
            doc.text('PRODUCTO', margin+3, y2+5);
            doc.text('PRECIO / KG', W-margin-3, y2+5, { align:'right' });
            y2 += 9;
            // Filas
            doc.setFont(undefined,'normal'); doc.setTextColor(40);
            items.forEach(p=>{
              if(y2 > H-12) { doc.addPage(); y2 = 16; y2 = dibujarHeader(y2); }
              doc.setFontSize(9.5); doc.setFont(undefined,'normal');
              doc.text(p.producto, margin+3, y2+4);
              doc.setFont(undefined,'bold'); doc.setTextColor(192,34,43);
              doc.text(fmt$(p.precio), W-margin-3, y2+4, { align:'right' });
              doc.setTextColor(40);
              doc.setDrawColor(235); doc.setLineWidth(0.2);
              doc.line(margin, y2+6, W-margin, y2+6);
              y2 += 7;
            });
            y2 += 4;
          });
        });

        // Footer en todas las páginas
        const totalPaginas = doc.internal.getNumberOfPages();
        for(let i=1;i<=totalPaginas;i++){
          doc.setPage(i);
          doc.setFontSize(7); doc.setTextColor(150); doc.setFont(undefined,'normal');
          doc.text('Precios sujetos a cambio sin previo aviso · Frigorífico Sersale', W/2, H-6, { align:'center' });
          doc.text('Página '+i+' de '+totalPaginas, W-margin, H-6, { align:'right' });
        }

        const fileName = 'Reporte de Precios - '+hoyStr.replace(/\//g,'-')+'.pdf';
        window.compartirOdescargarPDF(doc, fileName);
      }

      const q = busqueda.toLowerCase().trim();
      const visibles = (clientesLista||[]).filter(c=>!q || c.toLowerCase().includes(q));

      return (
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"16px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:800,fontSize:16}}>Exportar Reporte</div>
              <div style={{fontSize:12,opacity:0.85}}>{seleccionados.size} seleccionado{seleccionados.size!==1?'s':''}</div>
            </div>
            <button onClick={generarPDF} disabled={generando||seleccionados.size===0}
              style={{background:seleccionados.size===0?"rgba(255,255,255,0.2)":"#fff",color:seleccionados.size===0?"rgba(255,255,255,0.6)":"#6B4E8E",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:800,fontSize:13,cursor:seleccionados.size===0?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
              {generando ? "Generando..." : "Generar PDF"}
            </button>
          </div>

          <div style={{padding:16}}>
            {/* Buscador */}
            <div style={{position:"relative",marginBottom:12}}>
              <input
                style={{width:"100%",padding:"10px 14px 10px 36px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none",boxSizing:"border-box"}}
                placeholder="Buscar cliente..."
                value={busqueda} onChange={e=>setBusqueda(e.target.value)} />
              <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:16,color:"#A3ABB3"}}>🔍</span>
              {busqueda&&<button onClick={()=>setBusqueda("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#A3ABB3"}}>✕</button>}
            </div>

            {/* Controles */}
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              <button onClick={seleccionarTodos}
                style={{flex:1,padding:"8px 0",borderRadius:10,border:"1.5px solid #6B4E8E",background:"#fff",color:"#6B4E8E",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                ✓ Seleccionar todos {busqueda?'(visibles)':''}
              </button>
              <button onClick={deseleccionarTodos}
                style={{flex:1,padding:"8px 0",borderRadius:10,border:"1.5px solid #D8DCE0",background:"#fff",color:"#5C666F",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                Limpiar
              </button>
            </div>

            {/* Lista de clientes */}
            {clientesLista===null
              ? <div style={{textAlign:"center",color:"#A3ABB3",marginTop:40}}><p>Cargando clientes...</p></div>
              : visibles.length===0
                ? <div style={{textAlign:"center",color:"#A3ABB3",marginTop:40}}><div style={{fontSize:48}}>🔍</div><p>Sin clientes con precios cargados</p></div>
                : visibles.map(c=>{
                  const checked = seleccionados.has(c);
                  return (
                    <button key={c} onClick={()=>toggleCliente(c)}
                      style={{width:"100%",background:checked?"#F7EAEA":"#fff",borderRadius:12,border:`1.5px solid ${checked?"#A4232A":"#D8DCE0"}`,padding:"12px 14px",marginBottom:8,textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${checked?"#A4232A":"#B9BFC5"}`,background:checked?"#A4232A":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {checked && <span style={{color:"#fff",fontSize:14,fontWeight:900,lineHeight:1}}>✓</span>}
                      </div>
                      <span style={{fontSize:14,fontWeight:checked?700:500,color:checked?"#A4232A":"#191E23"}}>{c}</span>
                    </button>
                  );
                })
            }
          </div>
        </div>
      );
    }

        // ── TAB PRECIOS ──────────────────────────────────────────

      const [modalOpen, setModalOpen] = useState(false);
      const [editando, setEditando] = useState(null);
      const [formProd, setFormProd] = useState("");
      const [formPrecio, setFormPrecio] = useState("");
      const [guardando, setGuardando] = useState(false);
      // Usar PRODUCTOS global (mismo que en pedidos) — lista plana ordenada por categoría
      const PRODUCTOS_CAT = Object.entries(PRODUCTOS).sort((a,b)=>a[0].localeCompare(b[0],"es")).flatMap(([cat,prods])=>prods.filter(p=>p));

      // Cargar lista completa de clientes de Firebase
      useEffect(()=>{
        (async()=>{
          try {
            const {db,collection,getDocs,query,orderBy} = fb();
            const snap = await getDocs(query(collection(db,"clientes"),orderBy("nombre","asc")));
            setTodosClientes(snap.docs.map(d=>d.data().nombre).filter(Boolean));
          } catch(e){ console.error(e); }
        })();
      },[]);

      async function cargarPrecios(cliente) {
        setCargando(true); setPrecios([]);
        try {
          const {db,collection,getDocs,query,where} = fb();
          const snap = await getDocs(query(collection(db,"precios_cliente"),where("cliente","==",cliente)));
          // Deduplicar por producto: si hay varios docs, quedarse con el más reciente por fecha
          const mapProd = new Map();
          snap.docs.forEach(d=>{
            const data = { id:d.id, ...d.data() };
            if(!data.producto) return;
            const exist = mapProd.get(data.producto);
            if(!exist || (data.fecha||"") > (exist.fecha||"")) {
              mapProd.set(data.producto, data);
            }
          });
          const ps = Array.from(mapProd.values()).sort((a,b)=>a.producto.localeCompare(b.producto));
          setPrecios(ps);
        } catch(e){ console.error(e); }
        setCargando(false);
      }

      function onSelectCliente(nombre) {
        setClienteSel(nombre);
        if(nombre) cargarPrecios(nombre);
        else setPrecios([]);
      }

      function abrirNuevo() {
        setEditando(null); setFormProd(""); setFormPrecio(""); setModalOpen(true);
      }
      function abrirEditar(p) {
        setEditando(p); setFormProd(p.producto); setFormPrecio(String(p.precio)); setModalOpen(true);
      }

      async function guardar() {
        if(!formProd.trim()) return alert("Seleccioná un producto");
        if(!formPrecio||isNaN(+formPrecio)||+formPrecio<=0) return alert("Ingresá un precio válido");
        setGuardando(true);
        try {
          const {db,collection,addDoc,doc,updateDoc,getDocs,query,where} = fb();
          if(editando) {
            // Editar existente
            await updateDoc(doc(db,"precios_cliente",editando.id),{
              producto:formProd.trim(), precio:+formPrecio,
              fecha:new Date().toISOString()
            });
          } else {
            // Upsert: si ya existe ese producto para este cliente, actualizar; sino crear
            const snapEx = await getDocs(query(
              collection(db,"precios_cliente"),
              where("cliente","==",clienteSel),
              where("producto","==",formProd.trim())
            ));
            if(!snapEx.empty) {
              // Actualizar el más reciente
              await updateDoc(doc(db,"precios_cliente",snapEx.docs[0].id),{
                precio:+formPrecio, fecha:new Date().toISOString()
              });
            } else {
              await addDoc(collection(db,"precios_cliente"),{
                cliente:clienteSel, producto:formProd.trim(),
                precio:+formPrecio, fecha:new Date().toISOString()
              });
            }
          }
          setModalOpen(false);
          cargarPrecios(clienteSel);
        } catch(e){ alert("Error al guardar"); console.error(e); }
        setGuardando(false);
      }

      async function eliminar(id) {
        if(!confirm("¿Eliminar este precio?")) return;
        try {
          const {db,doc,deleteDoc} = fb();
          await deleteDoc(doc(db,"precios_cliente",id));
          cargarPrecios(clienteSel);
        } catch(e){ alert("Error"); }
      }

      function compartirWA() {
        if(!clienteSel||precios.length===0) return;
        const nl="%0A";
        let msg="*Lista de Precios — "+clienteSel+"*"+nl;
        msg+="Frigorífico Sersale"+nl+nl;
        precios.forEach(p=>{
          msg+="• "+p.producto+": *$"+Math.round(p.precio).toLocaleString("es-AR")+"*"+nl;
        });
        msg+=nl+"_Precios sujetos a cambio sin previo aviso_"+nl;
        msg+="_Frigorífico Sersale · (011) 6763-7860_";
        window.open("https://wa.me/?text="+msg,"_blank");
      }

      const fmt$ = n => "$"+Math.round(n).toLocaleString("es-AR");

      if (modoExportar) return <ReportePreciosClientes onBack={()=>setModoExportar(false)} />;

            📄 Exportar PDF de precios por cliente
          </button>

          {/* Selector de cliente */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontWeight:700,fontSize:12,color:"#3A424A",marginBottom:6}}>Cliente</label>
            <select style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff"}}
              value={clienteSel} onChange={e=>onSelectCliente(e.target.value)}>
              <option value="">— Seleccioná un cliente —</option>
              {todosClientes.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
          </div>

          {/* Sin cliente seleccionado */}
          {!clienteSel && (
            <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}>
              <div style={{fontSize:48}}>💲</div>
              <p style={{marginTop:8}}>Seleccioná un cliente para ver sus precios</p>
            </div>
          )}

          {/* Con cliente seleccionado */}
          {clienteSel && (
            <>
              {/* Acciones */}
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                <button onClick={compartirWA}
                  style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:"#25D366",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>

                </button>
              </div>

              {/* KPI */}
              <div style={{background:"#fff",borderLeft:"4px solid #A4232A",borderTop:"1px solid #EDEEF0",borderRight:"1px solid #EDEEF0",borderBottom:"1px solid #EDEEF0",borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
                <div>
                  <div style={{fontWeight:800,fontSize:14,color:"#111"}}>{clienteSel}</div>
                  <div style={{fontSize:12,color:"#79828B",marginTop:2}}>{precios.length} de {Object.values(PRODUCTOS).flat().filter(p=>p).length} productos con precio acordado</div>
                </div>
                <div style={{fontSize:11,color:"#79828B"}}>Tocá un precio para editarlo</div>
              </div>

              {/* Lista TODOS los productos agrupados por categoría */}
              {cargando ? (
                <p style={{textAlign:"center",color:"#79828B",marginTop:40}}>Cargando...</p>
              ) : (
                Object.entries(PRODUCTOS).sort((a,b)=>a[0].localeCompare(b[0],"es")).map(([cat, prods])=>{
                  const prodsValidos = prods.filter(p=>p);

                            style={{background:"#fff",borderRadius:10,borderLeft:`4px solid ${tienePrecio?"#A4232A":"#D8DCE0"}`,border:`1px solid #EDEEF0`,borderLeftWidth:4,borderLeftColor:tienePrecio?"#A4232A":"#D8DCE0",padding:"10px 12px",marginBottom:5,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>

          {/* Modal agregar/editar */}
          {modalOpen&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:10000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
              onClick={e=>{if(e.target===e.currentTarget)setModalOpen(false);}}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:480}}>

        // ── CUENTAS CORRIENTES ──────────────────────────────────
    function TabCuentasCorrientes({ refresh }) {
      const [clientes, setClientes] = useState(null);
      const [clienteAbierto, setClienteAbierto] = useState(null);
      const [modalPago, setModalPago] = useState(null);
      const [pagoForm, setPagoForm] = useState({monto:"",formaPago:"transferencia",obs:""});
      const [guardandoPago, setGuardandoPago] = useState(false);
      const [modalNuevo, setModalNuevo] = useState(false);
      const [nuevoNombre, setNuevoNombre] = useState("");
      const [clientesDisponibles, setClientesDisponibles] = useState([]);

      async function cargarClientesDisponibles() {
        try {
          const {db,collection,getDocs,query,orderBy} = fb();
          // Todos los clientes registrados
          const snapCli = await getDocs(query(collection(db,"clientes"),orderBy("nombre","asc")));
          const todos = snapCli.docs.map(d=>d.data().nombre).filter(Boolean);
          // Quitar los que ya tienen CC
          const snapCC = await getDocs(collection(db,"cuentas_corrientes"));
          const yaCC = new Set(snapCC.docs.map(d=>d.data().nombre));
          setClientesDisponibles(todos.filter(n=>!yaCC.has(n)));
        } catch(e){ console.error(e); }
      }

      async function cargar() {
        try {
          const {db,collection,getDocs,query,orderBy} = fb();
          const snap = await getDocs(query(collection(db,"cuentas_corrientes"),orderBy("nombre","asc")));
          setClientes(snap.docs.map(d=>({id:d.id,...d.data()})));
        } catch(e){ console.error(e); setClientes([]); }
      }

      useEffect(()=>{
        if(window.__fbReady) cargar(); else document.addEventListener("fbReady",cargar);
      },[]);

      // Refresco externo: una venta rápida cargada desde otra pestaña movió el saldo.
      // El ref evita una segunda lectura al montar cuando refresh ya venía en >0.
      const refrescoVisto = React.useRef(refresh);
      useEffect(()=>{
        if(refresh !== refrescoVisto.current) { refrescoVisto.current = refresh; cargar(); }
      },[refresh]);

      async function registrarPago() {
        const monto = parseFloat(pagoForm.monto);
        if(!monto||monto<=0) return alert("Ingresá un monto válido");
        setGuardandoPago(true);
        try {
          const {db,collection,addDoc,doc,updateDoc,getDocs,query,where} = fb();
          // 1. Registrar movimiento
          await addDoc(collection(db,"cc_movimientos"),{
            cliente:modalPago, tipo:"pago",
            formaPago:pagoForm.formaPago,
            monto, movimiento:-monto,
            obs:pagoForm.obs.trim(),
            fecha:new Date().toISOString().split("T")[0],
            detalle:"Pago — "+pagoForm.formaPago,
            createdAt:new Date().toISOString()
          });
          // 2. Recalcular saldo desde todos los movimientos (sin orderBy para evitar índice)
          const snap = await getDocs(query(collection(db,"cc_movimientos"),where("cliente","==",modalPago)));
          let saldo=0;
          snap.docs.forEach(d=>{ const m=d.data(); saldo += m.tipo==="pedido"?m.monto:-m.monto; });
          // 3. Actualizar saldo en cuenta corriente
          const cSnap = await getDocs(query(collection(db,"cuentas_corrientes"),where("nombre","==",modalPago)));
          if(!cSnap.empty) await updateDoc(doc(db,"cuentas_corrientes",cSnap.docs[0].id),{saldo:Math.round(saldo),ultimoMovimiento:new Date().toISOString().split("T")[0]});
          setModalPago(null);
          setPagoForm({monto:"",formaPago:"transferencia",obs:""});
          cargar();
          // Force detail to re-render by briefly closing and reopening
          if(clienteAbierto===modalPago) {
            const cli = clienteAbierto;
            setClienteAbierto(null);
            setTimeout(()=>setClienteAbierto(cli), 50);
          }
        } catch(e){ alert("Error al guardar: "+e.message); console.error(e); }
        setGuardandoPago(false);
      }

      async function crearCliente() {
        if(!nuevoNombre.trim()) return alert("Ingresá el nombre");
        try {
          const {db,collection,addDoc,Timestamp} = fb();
          await addDoc(collection(db,"cuentas_corrientes"),{
            nombre:nuevoNombre.trim(),saldo:0,
            creadoEn:new Date().toISOString(),ultimoMovimiento:new Date().toISOString().split("T")[0]
          });
          setNuevoNombre(""); setModalNuevo(false); cargar();
        } catch(e){ alert("Error"); }
      }

      const fmt$ = n => "$"+Math.round(Math.abs(n)).toLocaleString("es-AR");

      if(clienteAbierto) return <DetalleCuentaCorriente
        cliente={clienteAbierto}
        onBack={()=>{setClienteAbierto(null); cargar();}}
        onPago={()=>setModalPago(clienteAbierto)}
        onRefreshParent={cargar}
        refresh={refresh}
      />;

      const totalDeuda = (clientes||[]).filter(c=>c.saldo>0).reduce((s,c)=>s+c.saldo,0);
      const enDeuda = (clientes||[]).filter(c=>c.saldo>0).length;

      return (
        <div>
          {/* Resumen total */}
          {clientes && clientes.length>0 && (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              <div style={{background:"#fff",borderLeft:"4px solid #A4232A",borderTop:"1px solid #EDEEF0",borderRight:"1px solid #EDEEF0",borderBottom:"1px solid #EDEEF0",borderRadius:14,padding:"14px 12px",textAlign:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:13,fontWeight:800,color:"#A4232A"}}>{fmt$(totalDeuda)}</div>
                <div style={{fontSize:11,color:"#79828B",marginTop:2}}>Deuda total</div>
              </div>
              <div style={{background:"#fff",borderLeft:"4px solid #2A333B",borderTop:"1px solid #EDEEF0",borderRight:"1px solid #EDEEF0",borderBottom:"1px solid #EDEEF0",borderRadius:14,padding:"14px 12px",textAlign:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:22,fontWeight:800,color:"#2A333B"}}>{enDeuda}</div>
                <div style={{fontSize:11,color:"#79828B",marginTop:2}}>Con saldo</div>
              </div>
            </div>
          )}

          {/* Header + botón nuevo */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontWeight:700,fontSize:12,color:"#79828B",textTransform:"uppercase",letterSpacing:1}}>Cuentas Corrientes</span>
            <button onClick={()=>{setModalNuevo(true);cargarClientesDisponibles();}}
              style={{padding:"7px 14px",borderRadius:20,border:"none",background:"#A4232A",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>
              + Nueva
            </button>
          </div>

          {/* Lista */}
          {clientes===null ? <p style={{textAlign:"center",color:"#79828B",marginTop:40}}>Cargando...</p>
          : clientes.length===0 ? (
            <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}>
              <div style={{fontSize:48}}>💳</div>
              <p style={{marginBottom:16}}>Sin cuentas corrientes</p>
              <button onClick={()=>setModalNuevo(true)} style={{padding:"12px 24px",borderRadius:10,border:"none",background:"#A4232A",color:"#fff",fontWeight:700,cursor:"pointer"}}>+ Crear primera</button>
            </div>
          ) : clientes.map(cl=>{
            const deuda = cl.saldo>0;
            const color = deuda?"#A4232A":cl.saldo===0?"#2F6B4F":"#26536E";
            return (
              <div key={cl.id} style={{background:"#fff",borderRadius:14,borderLeft:`4px solid ${color}`,borderTop:"1px solid #EDEEF0",borderRight:"1px solid #EDEEF0",borderBottom:"1px solid #EDEEF0",padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:15,color:"#111",marginBottom:2}}>{cl.nombre}</div>
                    <div style={{fontSize:11,color:"#79828B"}}>
                      {deuda?"⚠️ Saldo pendiente":"✅ Al día"}
                      {cl.ultimoMovimiento&&` · Último: ${cl.ultimoMovimiento.split("-").reverse().join("/")}`}
                    </div>
                  </div>
                  <div style={{fontWeight:900,fontSize:18,color}}>{fmt$(cl.saldo)}</div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setClienteAbierto(cl.nombre)}
                    style={{flex:1,padding:"9px 0",borderRadius:10,border:"1.5px solid #D8DCE0",background:"#fff",color:"#262C32",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                    📋 Ver movimientos
                  </button>
                  <button onClick={()=>{setModalPago(cl.nombre);setPagoForm({monto:"",formaPago:"transferencia",obs:""}); }}
                    style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",background:"#2F6B4F",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                    💰 Registrar pago
                  </button>
                </div>
              </div>
            );
          })}

          {/* Modal nuevo cliente */}
          {modalNuevo&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:10000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
              onClick={e=>{if(e.target===e.currentTarget)setModalNuevo(false);}}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:480}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                  <span style={{fontWeight:800,fontSize:16}}>+ Nueva cuenta corriente</span>
                  <button onClick={()=>setModalNuevo(false)} style={{background:"#EDEEF0",border:"none",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:18}}>×</button>
                </div>
                {clientesDisponibles.length===0
                  ? <p style={{textAlign:"center",color:"#79828B",marginBottom:16,fontSize:13}}>Todos los clientes ya tienen cuenta corriente</p>
                  : <select style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",marginBottom:12}}
                      value={nuevoNombre} onChange={e=>setNuevoNombre(e.target.value)}>
                      <option value="">— Seleccioná un cliente —</option>
                      {clientesDisponibles.map(n=><option key={n} value={n}>{n}</option>)}
                    </select>

    // ── DETALLE CUENTA CORRIENTE ─────────────────────────────
    // ── MODAL PDF CUENTA CORRIENTE ────────────────────────────────
    function ModalPdfCC({ cliente, movimientos, saldo, onClose }) {
      const hoy = new Date().toISOString().split("T")[0];
      const hace30 = new Date(Date.now()-30*24*60*60*1000).toISOString().split("T")[0];
      const [desde, setDesde] = useState(hace30);
      const [hasta, setHasta] = useState(hoy);
      const [generando, setGenerando] = useState(false);

      const fmt$ = n => "$"+Math.round(Math.abs(n)).toLocaleString("es-AR");
      const fmtF = f => {
        if(!f) return "—";
        const iso = f.substring(0,10);
        if(!iso.match(/^\d{4}-\d{2}-\d{2}$/)) return f;
        const [y,m,d] = iso.split("-");
        return `${d}/${m}/${y}`;
      };

      const movsFiltrados = movimientos.filter(m=>{
        const f = (m.fecha||"").substring(0,10);
        return f >= desde && f <= hasta;
      });

      const totalFact = movsFiltrados.filter(m=>m.tipo==="pedido").reduce((s,m)=>s+m.monto,0);
      const totalPag  = movsFiltrados.filter(m=>m.tipo==="pago").reduce((s,m)=>s+m.monto,0);
      const saldoPeriodo = totalFact - totalPag;

      function generarPDF() {
        setGenerando(true);
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
          const PW = pdf.internal.pageSize.getWidth();
          const PH = pdf.internal.pageSize.getHeight();
          const M = 40, W = PW - M*2;

          // ── HEADER ──────────────────────────────────────────────
          pdf.setFillColor(192,57,43); pdf.rect(0,0,PW,70,'F');
          pdf.setFillColor(146,43,33); pdf.rect(0,0,8,70,'F');
          pdf.setFont('helvetica','bold'); pdf.setFontSize(18);
          pdf.setTextColor(255,255,255);
          pdf.text('CUENTA CORRIENTE', M+8, 42);
          pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
          pdf.setTextColor(255,200,200);
          pdf.text('Frigorífico Sersale SRL  ·  CUIT 30-70227633-7', PW-M, 38, {align:'right'});
          pdf.text('(011) 6763-7860  ·  @sersalefrigorifico', PW-M, 52, {align:'right'});

          let y = 86;

          // ── DATOS CLIENTE ────────────────────────────────────────
          pdf.setFillColor(248,248,248); pdf.rect(M,y,W,52,'F');
          pdf.setDrawColor(220,220,220); pdf.setLineWidth(0.5); pdf.rect(M,y,W,52,'S');
          pdf.setFillColor(192,57,43); pdf.rect(M,y,4,52,'F');

          pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor(30,30,30);
          pdf.text(cliente, M+14, y+20);
          pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(130,130,130);
          pdf.text(`Período: ${fmtF(desde)} al ${fmtF(hasta)}`, M+14, y+36);
          pdf.text(`Generado: ${fmtF(hoy)}`, PW-M, y+36, {align:'right'});
          y += 64;

          // ── RESUMEN ──────────────────────────────────────────────
          const boxW = (W-16)/3;
          const boxes = [
            {label:'Facturado en período', valor:fmt$(totalFact), color:[192,57,43]},
            {label:'Pagado en período',    valor:fmt$(totalPag),  color:[26,122,66]},
            {label:'Saldo actual',         valor:fmt$(saldo),     color:saldo>0?[192,57,43]:[26,122,66]},
          ];
          boxes.forEach((b,i)=>{
            const bx = M + i*(boxW+8);
            pdf.setFillColor(255,255,255); pdf.rect(bx,y,boxW,44,'F');
            pdf.setDrawColor(220,220,220); pdf.setLineWidth(0.5); pdf.rect(bx,y,boxW,44,'S');
            pdf.setFillColor(...b.color); pdf.rect(bx,y,boxW,4,'F');
            pdf.setFont('helvetica','bold'); pdf.setFontSize(12);
            pdf.setTextColor(...b.color);
            pdf.text(b.valor, bx+boxW/2, y+26, {align:'center'});
            pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(150,150,150);
            pdf.text(b.label, bx+boxW/2, y+37, {align:'center'});
          });
          y += 56;

          // ── TABLA MOVIMIENTOS ────────────────────────────────────
          if(movsFiltrados.length===0){
            pdf.setFont('helvetica','italic'); pdf.setFontSize(11); pdf.setTextColor(160,160,160);
            pdf.text('Sin movimientos en el período seleccionado.', PW/2, y+30, {align:'center'});
          } else {
            // Header tabla
            const COL={fecha:M, tipo:M+70, detalle:M+130, monto:PW-M-70, saldoAc:PW-M};
            const HDR_H=22, ROW_H=26, FTR_H=22;

            pdf.setFillColor(40,40,40); pdf.rect(M,y,W,HDR_H,'F');
            pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5); pdf.setTextColor(200,200,200);
            pdf.text('FECHA',        COL.fecha+4,  y+HDR_H/2+3);
            pdf.text('TIPO',         COL.tipo+4,   y+HDR_H/2+3);
            pdf.text('DETALLE',      COL.detalle+4,y+HDR_H/2+3);
            pdf.setTextColor(220,150,150);
            pdf.text('IMPORTE',      COL.monto,    y+HDR_H/2+3, {align:'right'});
            pdf.setTextColor(180,200,220);
            pdf.text('SALDO',        COL.saldoAc,  y+HDR_H/2+3, {align:'right'});
            y += HDR_H;

            // Calcular saldo acumulado desde el inicio de todos los movimientos
            // para mostrar saldo corrido en el período
            let saldoAcum = 0;
            // Primero sumar todos los movimientos ANTES del período
            movimientos.filter(m=>(m.fecha||"").substring(0,10)<desde)
              .forEach(m=>{ saldoAcum += m.tipo==="pedido"?m.monto:-m.monto; });

            movsFiltrados.forEach((mov,i)=>{
              // Nueva página si no hay espacio
              if(y+ROW_H > PH-FTR_H-10){
                // Footer
                drawFtrPDF(pdf,PW,PH,M,cliente);
                pdf.addPage();
                // Re-header
                pdf.setFillColor(192,57,43); pdf.rect(0,0,PW,50,'F');
                pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(255,255,255);
                pdf.text('CUENTA CORRIENTE — '+cliente+' (cont.)', M+8, 30);
                y = 60;
                // Re-header tabla
                pdf.setFillColor(40,40,40); pdf.rect(M,y,W,HDR_H,'F');
                pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5); pdf.setTextColor(200,200,200);
                pdf.text('FECHA',COL.fecha+4,y+HDR_H/2+3);
                pdf.text('TIPO',COL.tipo+4,y+HDR_H/2+3);
                pdf.text('DETALLE',COL.detalle+4,y+HDR_H/2+3);
                pdf.setTextColor(220,150,150); pdf.text('IMPORTE',COL.monto,y+HDR_H/2+3,{align:'right'});
                pdf.setTextColor(180,200,220); pdf.text('SALDO',COL.saldoAc,y+HDR_H/2+3,{align:'right'});
                y += HDR_H;
              }

              saldoAcum += mov.tipo==="pedido"?mov.monto:-mov.monto;
              const esPago = mov.tipo==="pago";

              if(i%2===0){pdf.setFillColor(252,252,252);}else{pdf.setFillColor(255,255,255);}
              pdf.rect(M,y,W,ROW_H,'F');
              pdf.setDrawColor(240,240,240); pdf.setLineWidth(0.3);
              pdf.line(M,y+ROW_H,M+W,y+ROW_H);

              // Acento color
              pdf.setFillColor(esPago?26:192, esPago?122:57, esPago?66:43);
              pdf.rect(M,y,3,ROW_H,'F');

              // Fecha
              pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(80,80,80);
              pdf.text(fmtF(mov.fecha), COL.fecha+8, y+ROW_H/2+3.5);

              // Tipo chip
              pdf.setFillColor(esPago?232:255, esPago?245:237, esPago?239:236);
              pdf.rect(COL.tipo+4, y+5, 42, 16,'F');
              pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
              pdf.setTextColor(esPago?26:192, esPago?122:57, esPago?66:43);
              pdf.text(esPago?'PAGO':'PEDIDO', COL.tipo+25, y+ROW_H/2+3, {align:'center'});

              // Detalle
              pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(100,100,100);
              let det = (mov.detalle||mov.obs||'-');
              if(det.length>38) det=det.substring(0,36)+'...';
              pdf.text(det, COL.detalle+4, y+ROW_H/2+3.5);

              // Monto
              pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5);
              pdf.setTextColor(esPago?26:192, esPago?122:57, esPago?66:43);
              pdf.text((esPago?'-':'+')+fmt$(mov.monto), COL.monto, y+ROW_H/2+4, {align:'right'});

              // Saldo acumulado
              pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5);
              pdf.setTextColor(saldoAcum>0?192:26, saldoAcum>0?57:122, saldoAcum>0?43:66);
              pdf.text(fmt$(saldoAcum), COL.saldoAc, y+ROW_H/2+4, {align:'right'});

              y += ROW_H;
            });

            // Fila totales
            y += 4;
            pdf.setFillColor(245,245,245); pdf.rect(M,y,W,28,'F');
            pdf.setDrawColor(200,200,200); pdf.setLineWidth(0.5); pdf.rect(M,y,W,28,'S');
            pdf.setFont('helvetica','bold'); pdf.setFontSize(9); pdf.setTextColor(60,60,60);
            pdf.text(`${movsFiltrados.length} movimiento${movsFiltrados.length!==1?'s':''}`, M+10, y+18);
            pdf.setTextColor(192,57,43);
            pdf.text('Saldo: '+fmt$(saldo), COL.saldoAc, y+18, {align:'right'});
          }

          drawFtrPDF(pdf,PW,PH,M,cliente);

          const fechaArchivo = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
          pdf.save(`CC_Sersale_${cliente.replace(/\s+/g,'_')}_${fmtF(desde)}_${fmtF(hasta)}.pdf`);
        } catch(e){
          alert("Error al generar PDF: "+e.message);
          console.error(e);
        }
        setGenerando(false);
      }

      function drawFtrPDF(pdf,PW,PH,M,cliente){
        pdf.setFillColor(248,248,248); pdf.rect(0,PH-22,PW,22,'F');
        pdf.setDrawColor(220,220,220); pdf.setLineWidth(0.4); pdf.line(0,PH-22,PW,PH-22);
        pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(160,160,160);
        pdf.text('Frigorífico Sersale SRL  ·  CUIT 30-70227633-7  ·  Documento informativo — no válido como factura',
          PW/2, PH-7, {align:'center'});
      }

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:300,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
          onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,padding:"24px 20px 36px"}}>
            {/* Header modal */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>Exportar PDF</div>
                <div style={{fontSize:12,color:"#79828B",marginTop:2}}>{cliente}</div>
              </div>
              <button onClick={onClose} style={{background:"#EDEEF0",border:"none",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:18}}>×</button>
            </div>

            {/* Selector de fechas */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              <div>
                <label style={{display:"block",fontSize:12,fontWeight:700,color:"#555",marginBottom:5}}>Desde</label>
                <input type="date" value={desde} onChange={e=>setDesde(e.target.value)}
                  style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:14,fontFamily:"inherit"}} />
              </div>
              <div>
                <label style={{display:"block",fontSize:12,fontWeight:700,color:"#555",marginBottom:5}}>Hasta</label>
                <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)}
                  style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #D8DCE0",fontSize:14,fontFamily:"inherit"}} />
              </div>
            </div>

            {/* Preview */}
            <div style={{background:"#F7F8F9",borderRadius:12,padding:"12px 16px",marginBottom:20,fontSize:13}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{color:"#79828B"}}>Movimientos en el período</span>
                <span style={{fontWeight:800}}>{movsFiltrados.length}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{color:"#79828B"}}>Facturado</span>
                <span style={{fontWeight:700,color:"#A4232A"}}>{fmt$(totalFact)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{color:"#79828B"}}>Pagado</span>
                <span style={{fontWeight:700,color:"#2F6B4F"}}>{fmt$(totalPag)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid #E4E7EA",paddingTop:8}}>
                <span style={{color:"#79828B"}}>Saldo actual</span>
                <span style={{fontWeight:900,fontSize:15,color:saldo>0?"#A4232A":"#2F6B4F"}}>{fmt$(saldo)}</span>

            <button onClick={generarPDF} disabled={generando||movsFiltrados.length===0}

                background:generando||movsFiltrados.length===0?"#B9BFC5":"#A4232A",
                color:"#fff",fontWeight:800,fontSize:15,cursor:"pointer",
                boxShadow:movsFiltrados.length>0?"0 4px 14px rgba(192,57,43,0.4)":"none"}}>
              {generando?"Generando...":movsFiltrados.length===0?"Sin movimientos en el período":"📥 Descargar PDF"}
            </button>
          </div>
        </div>
      );
    }

    function DetalleCuentaCorriente({ cliente, onBack, onPago, onRefreshParent, refresh }) {
      const [movimientos, setMovimientos] = useState(null);
      const [saldo, setSaldo] = useState(0);
      const [ventaOpen, setVentaOpen] = useState(false);
      const [pdfOpen, setPdfOpen] = useState(false);

      async function cargar() {
        try {
          const {db,collection,getDocs,query,where} = fb();
          const snap = await getDocs(query(
            collection(db,"cc_movimientos"),
            where("cliente","==",cliente)
          ));
          // Ordenar en cliente por fecha + createdAt
          const movs = snap.docs.map(d=>({id:d.id,...d.data()}))
            .sort((a,b)=>{
              const fd = (a.fecha||"").localeCompare(b.fecha||"");
              if(fd!==0) return fd;
              return (a.createdAt||"").localeCompare(b.createdAt||"");
            });
          setMovimientos(movs);
          let s=0; movs.forEach(m=>{ s += m.tipo==="pedido"?m.monto:-m.monto; });
          setSaldo(Math.round(s));
        } catch(e){ console.error(e); setMovimientos([]); }
      }

      useEffect(()=>{
        if(window.__fbReady) cargar(); else document.addEventListener("fbReady",cargar);
      },[]);

      // Refresco externo: el saldo y los movimientos cambiaron desde otra pantalla
      const refrescoVisto = React.useRef(refresh);
      useEffect(()=>{
        if(refresh !== refrescoVisto.current) { refrescoVisto.current = refresh; cargar(); }
      },[refresh]);

      const fmt$ = n => "$"+Math.round(Math.abs(n)).toLocaleString("es-AR");
      const fmtF = f => {
        if(!f) return "—";
        // Tomar solo los primeros 10 chars (YYYY-MM-DD) e ignorar el resto
        const iso = f.substring(0,10);
        if(!iso.match(/^\d{4}-\d{2}-\d{2}$/)) return f;
        const [y,m,d] = iso.split("-");
        return `${d}/${m}/${y}`;
      };
      const totalPedidos = (movimientos||[]).filter(m=>m.tipo==="pedido").reduce((s,m)=>s+m.monto,0);
      const totalPagos   = (movimientos||[]).filter(m=>m.tipo==="pago").reduce((s,m)=>s+m.monto,0);

      return (
        <>
        <div className="crm-page">
          <div className="chapa" style={{background:"#12161A",borderBottom:"2px solid #A4232A",color:"#fff",padding:"18px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:"0 4px 20px rgba(192,57,43,0.35)"}}>
            <button onClick={onBack} style={{background:"none",color:"#fff",border:"none",cursor:"pointer",fontSize:20,padding:0}}>←</button>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:16}}>{cliente}</div>
              <div style={{fontSize:11,opacity:.85}}>Cuenta corriente</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setPdfOpen(true)} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:20,padding:"6px 10px",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                📄 PDF
              </button>
              <button onClick={()=>setVentaOpen(true)} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:20,padding:"6px 10px",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                Venta
              </button>
              <button onClick={onPago} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:20,padding:"6px 10px",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                💰 Pago
              </button>
            </div>
          </div>

          <div style={{padding:16}}>
            {/* Resumen */}
            <div style={{background:"#fff",borderRadius:14,border:"1px solid #EDEEF0",padding:16,marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#A4232A"}}>{fmt$(totalPedidos)}</div>
                  <div style={{fontSize:10,color:"#79828B",marginTop:2}}>Facturado</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#2F6B4F"}}>{fmt$(totalPagos)}</div>
                  <div style={{fontSize:10,color:"#79828B",marginTop:2}}>Pagado</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:13,fontWeight:800,color:saldo>0?"#A4232A":"#2F6B4F"}}>{fmt$(saldo)}</div>
                  <div style={{fontSize:10,color:"#79828B",marginTop:2}}>Saldo</div>
                </div>
              </div>
              <div style={{background:saldo>0?"#F7EAEA":"#DDE9E2",borderRadius:10,padding:"8px 12px",textAlign:"center",fontSize:13,fontWeight:800,color:saldo>0?"#7E1A20":"#24523D"}}>
                {saldo>0?`⚠️ Debe ${fmt$(saldo)}`:"✅ Al día"}
              </div>
            </div>

            {/* Movimientos */}
            <p style={{fontWeight:700,fontSize:12,color:"#79828B",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
              Movimientos ({(movimientos||[]).length})
            </p>
            {movimientos===null?<p style={{textAlign:"center",color:"#79828B"}}>Cargando...</p>

    function TabStats({ pedidos }) {
      const [periodo, setPeriodo] = useState(() => {
        const n = new Date();
        return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
      });
      const filtrados = pedidos.filter(p=>p.estado!=="cancelado"&&p.fechaEntrega&&p.fechaEntrega.startsWith(periodo));
      const prods = {};
      filtrados.forEach(p=>{
        (p.items||[]).forEach(it=>{
          const k = it.producto;
          if(!prods[k]) prods[k]={nombre:it.producto,unidades:0,kgTotal:0,pedidos:0,unidad:it.unidad||"kg"};
          const cant = parseFloat(it.cantidad)||0;
          const kg   = it.kgReal!=null ? parseFloat(it.kgReal)||0 : cant;
          if(it.unidad==="kg"){
            prods[k].unidades += cant;
            prods[k].kgTotal  += cant;
          } else {
            prods[k].unidades += cant;
            prods[k].kgTotal  += kg;
          }
          prods[k].pedidos++;
        });
      });
      const rankP = Object.values(prods).sort((a,b)=>b.kgTotal-a.kgTotal);
      const maxP = rankP[0]?.kgTotal||1;
      const clis = {};
      filtrados.forEach(p=>{if(!clis[p.cliente])clis[p.cliente]={nombre:p.cliente,pedidos:0};clis[p.cliente].pedidos++;});
      const rankC = Object.values(clis).sort((a,b)=>b.pedidos-a.pedidos).slice(0,8);
      const dias=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],porDiaS=[0,0,0,0,0,0,0];
      filtrados.forEach(p=>{if(p.fechaEntrega)porDiaS[new Date(p.fechaEntrega+"T12:00:00").getDay()]++;});
      const maxD=Math.max(...porDiaS)||1;
      return (
        <div>
          <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
            <input type="month" style={{flex:1,padding:"10px 12px",borderRadius:12,border:"1.5px solid #D8DCE0",fontSize:14,background:"#fff",outline:"none"}}
              value={periodo} onChange={e=>setPeriodo(e.target.value)} />
            <div style={{background:"#2A333B",color:"#fff",borderRadius:12,padding:"10px 14px",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{filtrados.length} pedidos</div>
          </div>
          {filtrados.length===0 ? (
            <div style={{textAlign:"center",color:"#A3ABB3",marginTop:60}}><div style={{fontSize:48}}>📊</div><p>Sin datos para este período</p></div>
          ) : (<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              <div style={{background:"#fff",borderRadius:14,padding:"14px 12px",border:"1.5px solid #2A333B",textAlign:"center"}}>
                <div style={{fontSize:26,fontWeight:900,color:"#2A333B"}}>{rankP.length}</div>
                <div style={{fontSize:11,color:"#79828B",marginTop:2}}>Productos distintos</div>
              </div>
              <div style={{background:"#fff",borderRadius:14,padding:"14px 12px",border:"1.5px solid #6B4E8E",textAlign:"center"}}>
                <div style={{fontSize:26,fontWeight:900,color:"#6B4E8E"}}>{rankC.length}</div>
                <div style={{fontSize:11,color:"#79828B",marginTop:2}}>Clientes activos</div>
              </div>
            </div>
            <p style={{fontWeight:700,fontSize:12,color:"#5C666F",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Top productos por cantidad</p>
            <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",overflow:"hidden",marginBottom:16}}>
              {/* Header tabla */}
              <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,padding:"8px 14px",background:"#F7F8F9",borderBottom:"1px solid #EDEEF0"}}>
                <span style={{fontSize:10,fontWeight:800,color:"#79828B",textTransform:"uppercase",letterSpacing:.5}}>Producto</span>
                <span style={{fontSize:10,fontWeight:800,color:"#79828B",textTransform:"uppercase",letterSpacing:.5,textAlign:"right",minWidth:70}}>Unidades</span>
                <span style={{fontSize:10,fontWeight:800,color:"#79828B",textTransform:"uppercase",letterSpacing:.5,textAlign:"right",minWidth:60}}>Kg total</span>
              </div>
              {rankP.slice(0,10).map((p,i)=>(
                <div key={p.nombre} style={{padding:"10px 14px",borderBottom:i<Math.min(rankP.length,10)-1?"1px solid #F7F8F9":"none"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,alignItems:"center",marginBottom:5}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>
                      <span style={{fontSize:11,fontWeight:700,color:"#fff",background:i===0?"#B5872F":i===1?"#95A5A6":i===2?"#CD6155":"#2A333B",borderRadius:99,width:20,height:20,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{i+1}</span>
                      <span style={{fontSize:13,fontWeight:600,color:"#262C32",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre}</span>
                    </div>
                    {/* Columna unidades — solo si no es kg */}
                    <span style={{fontWeight:700,fontSize:12,color:"#2A333B",textAlign:"right",minWidth:70,whiteSpace:"nowrap"}}>
                      {p.unidad==="kg" ? "—" : `${Number.isInteger(p.unidades)?p.unidades:p.unidades.toFixed(1)} ${p.unidad}`}
                    </span>
                    {/* Columna kg totales */}
                    <span style={{fontWeight:700,fontSize:12,color:"#A4232A",textAlign:"right",minWidth:60,whiteSpace:"nowrap"}}>
                      {p.kgTotal>0 ? `${Number.isInteger(p.kgTotal)?p.kgTotal:p.kgTotal.toFixed(1)} kg` : "—"}
                    </span>
                  </div>
                  <div style={{background:"#EDEEF0",borderRadius:99,height:4,overflow:"hidden"}}>
                    <div style={{background:i===0?"#B5872F":"#2A333B",height:"100%",borderRadius:99,width:(p.kgTotal/maxP*100)+"%"}}/>
                  </div>
                </div>
              ))}
            </div>
            <p style={{fontWeight:700,fontSize:12,color:"#5C666F",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Clientes más frecuentes</p>
            <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:16}}>
              {rankC.map((cl,i)=>(
                <div key={cl.nombre} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<rankC.length-1?"1px solid #F2F3F5":"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#6B4E8E",background:"#F5EEF8",borderRadius:99,width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center"}}>{i+1}</span>
                    <span style={{fontSize:13,color:"#262C32"}}>{cl.nombre}</span>
                  </div>
                  <span style={{fontSize:12,color:"#79828B"}}><strong style={{color:"#6B4E8E"}}>{cl.pedidos}</strong> pedido{cl.pedidos!==1?"s":""}</span>
                </div>
              ))}
            </div>
            <p style={{fontWeight:700,fontSize:12,color:"#5C666F",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Pedidos por día de semana</p>
            <div style={{background:"#fff",borderRadius:14,border:"1px solid var(--borde)",boxShadow:"var(--sombra)",padding:14,marginBottom:16}}>
              <div style={{display:"flex",gap:4,alignItems:"flex-end",height:80,justifyContent:"space-between"}}>
                {dias.map((dia,i)=>(
                  <div key={dia} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                    <span style={{fontSize:10,color:"#2A333B",fontWeight:700}}>{porDiaS[i]>0?porDiaS[i]:""}</span>
                    <div style={{width:"100%",background:porDiaS[i]>0?"#2A333B":"#E4E7EA",borderRadius:"4px 4px 0 0",height:(porDiaS[i]/maxD*60+4)+"px"}}/>
                    <span style={{fontSize:10,color:"#79828B"}}>{dia}</span>
                  </div>
                ))}
              </div>
            </div>
          </>)}
        </div>
      );
    }

    // ── COMPONENTE TAB ALERTAS ──────────────────────────────
    // ── RECONTACTOS ─────────────────────────────────────────
    // Fuente única: alertasData.alertas (calculado en calcularAlertas,

      );
      const pendientes = alertasData.alertas.filter(a=>!contactados.includes(a.cliente));
